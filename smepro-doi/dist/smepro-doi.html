<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SMEPro · DOI Builder</title>
  <style>
/* ============================================================================
   SMEPro DOI Builder — Design System
   Light-only. There is intentionally NO dark theme and NO dark surface anywhere;
   the darkest background token is a pale slate (#eef2f6). Swap the brand tokens
   below for the official SMEPro palette/logo when available.
   ========================================================================== */

:root {
  /* --- Brand (placeholder SMEPro palette — replace with official values) --- */
  --brand-primary:      #0b3b5e;   /* deep petroleum navy */
  --brand-primary-700:  #0e4a76;
  --brand-primary-600:  #14598c;
  --brand-accent:       #c4892b;   /* refinery amber */
  --brand-accent-soft:  #f7ead2;

  /* --- Neutrals (light only) --- */
  --bg:            #f4f7fa;        /* app canvas */
  --surface:       #ffffff;        /* cards */
  --surface-2:     #f8fafc;        /* subtle panels */
  --surface-3:     #eef2f6;        /* darkest allowed surface */
  --border:        #e1e8ef;
  --border-strong: #cdd8e3;

  --ink:        #14222e;           /* primary text */
  --ink-2:      #3d4f5d;           /* secondary text */
  --ink-3:      #6b7b88;           /* muted */

  /* --- Status --- */
  --ok:        #1f8a52;  --ok-bg:        #e7f5ec;
  --critical:  #b3261e;  --critical-bg:  #fbe9e8;
  --high:      #c4541b;  --high-bg:      #fcecdf;
  --medium:    #9a6a00;  --medium-bg:    #fbf2da;
  --info:      #2b6cb0;  --info-bg:      #e8f1fb;

  /* --- Geometry --- */
  --radius:     10px;
  --radius-sm:  7px;
  --radius-lg:  16px;
  --shadow-sm:  0 1px 2px rgba(16, 40, 60, .06), 0 1px 3px rgba(16, 40, 60, .05);
  --shadow-md:  0 4px 14px rgba(16, 40, 60, .08), 0 2px 6px rgba(16, 40, 60, .05);
  --shadow-lg:  0 14px 40px rgba(16, 40, 60, .14);

  --font-sans: "Inter", "Segoe UI", system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif;
  --font-serif: "Georgia", "Times New Roman", serif;
  --font-mono: "SFMono-Regular", "JetBrains Mono", Menlo, Consolas, monospace;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font-family: var(--font-sans);
  color: var(--ink);
  background: var(--bg);
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  font-feature-settings: "tnum" 1, "cv05" 1;
}

/* ----------------------------------------------------------- App shell ----- */
.app-header {
  position: sticky; top: 0; z-index: 20;
  display: flex; align-items: center; gap: 18px;
  padding: 14px 28px;
  background: linear-gradient(180deg, #ffffff 0%, #fbfdff 100%);
  border-bottom: 1px solid var(--border);
  box-shadow: var(--shadow-sm);
}
.brand { display: flex; align-items: center; gap: 12px; }
.brand__logo { height: 34px; width: auto; display: block; }
.brand__title { display: flex; flex-direction: column; line-height: 1.1; }
.brand__title b { font-size: 16px; letter-spacing: .2px; color: var(--brand-primary); }
.brand__title span { font-size: 11px; color: var(--ink-3); letter-spacing: .8px; text-transform: uppercase; }
.app-header__spacer { flex: 1; }
.app-header__meta { font-size: 12px; color: var(--ink-3); text-align: right; }
.app-header__meta b { color: var(--ink-2); }

.layout { display: grid; grid-template-columns: 248px 1fr; min-height: calc(100vh - 63px); }

/* --------------------------------------------------------------- Nav ------- */
.nav {
  border-right: 1px solid var(--border);
  background: var(--surface);
  padding: 18px 12px;
  position: sticky; top: 63px; align-self: start; height: calc(100vh - 63px);
}
.nav__group { font-size: 11px; text-transform: uppercase; letter-spacing: .7px; color: var(--ink-3); margin: 6px 10px 8px; }
.nav__item {
  display: flex; align-items: center; gap: 10px;
  padding: 9px 12px; margin: 2px 0; border-radius: var(--radius-sm);
  font-size: 14px; color: var(--ink-2); cursor: pointer; user-select: none;
  border: 1px solid transparent;
}
.nav__item:hover { background: var(--surface-2); color: var(--ink); }
.nav__item.is-active { background: var(--brand-accent-soft); color: var(--brand-primary); font-weight: 600; border-color: #efdcb8; }
.nav__num { width: 22px; height: 22px; border-radius: 6px; background: var(--surface-3); color: var(--ink-2);
  display: grid; place-items: center; font-size: 12px; font-weight: 700; }
.nav__item.is-active .nav__num { background: var(--brand-primary); color: #fff; }

/* ------------------------------------------------------------- Main -------- */
.main { padding: 28px 36px 80px; max-width: 1180px; }
.step { display: none; animation: fade .25s ease; }
.step.is-active { display: block; }
@keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

.step__head { margin-bottom: 18px; }
.step__eyebrow { font-size: 12px; letter-spacing: .8px; text-transform: uppercase; color: var(--brand-accent); font-weight: 700; }
.step__title { font-size: 26px; margin: 4px 0 6px; color: var(--ink); letter-spacing: -.3px; }
.step__sub { color: var(--ink-2); font-size: 14.5px; max-width: 760px; }

/* ------------------------------------------------------------ Cards -------- */
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg);
  box-shadow: var(--shadow-sm); padding: 20px 22px; margin-bottom: 18px; }
.card__title { font-size: 13px; text-transform: uppercase; letter-spacing: .6px; color: var(--ink-3); margin: 0 0 14px; font-weight: 700; }

.summary-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 14px; margin-bottom: 22px; }
.stat { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 14px 16px; box-shadow: var(--shadow-sm); }
.stat__label { font-size: 11.5px; text-transform: uppercase; letter-spacing: .5px; color: var(--ink-3); }
.stat__value { font-size: 22px; font-weight: 700; color: var(--brand-primary); margin-top: 4px; font-variant-numeric: tabular-nums; }
.stat__hint { font-size: 12px; color: var(--ink-3); margin-top: 2px; }

/* ------------------------------------------------------------ Badges ------- */
.badge { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px;
  font-size: 12px; font-weight: 600; border: 1px solid transparent; }
.badge--ok       { background: var(--ok-bg);       color: var(--ok);       border-color: #c4e6cf; }
.badge--critical { background: var(--critical-bg); color: var(--critical); border-color: #f1c9c6; }
.badge--high     { background: var(--high-bg);     color: var(--high);     border-color: #f4d2bb; }
.badge--medium   { background: var(--medium-bg);   color: var(--medium);   border-color: #ecdcab; }
.badge--info     { background: var(--info-bg);     color: var(--info);     border-color: #c6ddf3; }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }

/* ------------------------------------------------------------ Tables ------- */
.table-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: var(--radius); }
table.data { width: 100%; border-collapse: collapse; font-size: 13.5px; background: var(--surface); }
table.data thead th {
  text-align: left; padding: 11px 14px; background: var(--surface-3); color: var(--ink-2);
  font-size: 11.5px; text-transform: uppercase; letter-spacing: .5px; border-bottom: 1px solid var(--border-strong);
  position: sticky; top: 0; white-space: nowrap;
}
table.data tbody td { padding: 11px 14px; border-bottom: 1px solid var(--border); color: var(--ink); vertical-align: top; }
table.data tbody tr:last-child td { border-bottom: none; }
table.data tbody tr:hover { background: var(--surface-2); }
table.data .num { font-variant-numeric: tabular-nums; font-family: var(--font-mono); text-align: right; white-space: nowrap; }
table.data tfoot td { padding: 12px 14px; font-weight: 700; background: var(--surface-3); border-top: 2px solid var(--border-strong); }
.muted { color: var(--ink-3); }
.src { font-family: var(--font-mono); font-size: 12px; color: var(--ink-3); }

.type-pill { font-size: 11.5px; font-weight: 600; padding: 2px 9px; border-radius: 6px; white-space: nowrap; }
.type-pill[data-t="Royalty (NPRI)"]            { background: #eef4ec; color: #2f6b3e; }
.type-pill[data-t="Mineral (Lessor Royalty)"]  { background: #eaf1f8; color: #1f5a93; }
.type-pill[data-t="ORRI"]                       { background: #f6efe1; color: #8a6411; }
.type-pill[data-t="Working Interest (NRI)"]     { background: #f0eef7; color: #574a8c; }

/* --------------------------------------------------------- Run sheet ------- */
.timeline { position: relative; margin-left: 8px; padding-left: 26px; }
.timeline::before { content: ""; position: absolute; left: 7px; top: 4px; bottom: 4px; width: 2px; background: var(--border-strong); }
.tl-item { position: relative; margin-bottom: 16px; }
.tl-item::before { content: ""; position: absolute; left: -26px; top: 4px; width: 14px; height: 14px; border-radius: 50%;
  background: #fff; border: 3px solid var(--brand-accent); box-shadow: 0 0 0 3px #fff; }
.tl-date { font-family: var(--font-mono); font-size: 12px; color: var(--ink-3); }
.tl-title { font-weight: 650; color: var(--ink); margin: 1px 0 3px; }
.tl-meta { font-size: 13px; color: var(--ink-2); }
.tl-effects { margin: 6px 0 0; padding: 0; list-style: none; }
.tl-effects li { font-size: 12.5px; color: var(--ink-2); padding-left: 16px; position: relative; }
.tl-effects li::before { content: "→"; position: absolute; left: 0; color: var(--brand-accent); }
.tl-lang { margin-top: 6px; font-style: italic; font-size: 12.5px; color: var(--ink-3); border-left: 3px solid var(--border-strong); padding-left: 10px; }

/* ----------------------------------------------------- Ownership tree ------ */
.tree { font-family: var(--font-sans); }
.tree-node { margin: 0; }
.tree-children { list-style: none; margin: 0 0 0 14px; padding: 0 0 0 18px; border-left: 2px solid var(--border-strong); }
.tree-row { display: flex; align-items: baseline; gap: 10px; padding: 6px 0; }
.tree-row .nm { font-weight: 600; color: var(--ink); }
.tree-row .frac { font-family: var(--font-mono); font-size: 12.5px; color: var(--ink-2); background: var(--surface-3);
  padding: 1px 8px; border-radius: 6px; }
.tree-row .dec { font-family: var(--font-mono); font-size: 12.5px; color: var(--brand-primary); font-weight: 600; }
.tree-row .role { font-size: 12px; color: var(--ink-3); }

.flow { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.flow .pool { border: 1px dashed var(--border-strong); border-radius: var(--radius); padding: 14px 16px; background: var(--surface-2); }
.flow .pool h4 { margin: 0 0 6px; font-size: 13px; color: var(--ink-2); }
.bar { height: 14px; border-radius: 7px; overflow: hidden; display: flex; margin: 10px 0; border: 1px solid var(--border); }
.bar span { display: block; height: 100%; }

/* ------------------------------------------------------- Curative ---------- */
.flag { display: grid; grid-template-columns: 6px 1fr; gap: 14px; border: 1px solid var(--border);
  border-radius: var(--radius); background: var(--surface); margin-bottom: 12px; overflow: hidden; box-shadow: var(--shadow-sm); }
.flag__rail { width: 6px; }
.flag--critical .flag__rail { background: var(--critical); }
.flag--high     .flag__rail { background: var(--high); }
.flag--medium   .flag__rail { background: var(--medium); }
.flag--info     .flag__rail { background: var(--info); }
.flag__body { padding: 14px 16px 14px 0; }
.flag__head { display: flex; align-items: center; gap: 10px; margin-bottom: 5px; }
.flag__title { font-weight: 650; color: var(--ink); font-size: 14.5px; }
.flag__code { font-family: var(--font-mono); font-size: 11px; color: var(--ink-3); margin-left: auto; }
.flag__detail { font-size: 13.5px; color: var(--ink-2); }
.flag__detail strong { color: var(--ink); }

/* ------------------------------------------------------------ Bits --------- */
.toolbar { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
.toggle { display: inline-flex; border: 1px solid var(--border-strong); border-radius: 999px; overflow: hidden; background: var(--surface); }
.toggle button { border: none; background: transparent; padding: 7px 16px; font-size: 13px; font-weight: 600; color: var(--ink-2); cursor: pointer; }
.toggle button.is-active { background: var(--brand-primary); color: #fff; }
.btn { border: 1px solid var(--border-strong); background: var(--surface); color: var(--ink); padding: 8px 16px;
  border-radius: var(--radius-sm); font-size: 13.5px; font-weight: 600; cursor: pointer; box-shadow: var(--shadow-sm); }
.btn:hover { background: var(--surface-2); }
.btn--primary { background: var(--brand-primary); color: #fff; border-color: var(--brand-primary); }
.btn--primary:hover { background: var(--brand-primary-700); }
.note { font-size: 12.5px; color: var(--ink-3); }
.kpi-row { display: flex; gap: 8px; align-items: center; }
.disclaimer { margin-top: 26px; padding: 14px 16px; background: var(--surface-2); border: 1px solid var(--border);
  border-radius: var(--radius); font-size: 12.5px; color: var(--ink-3); }

</style>

/* ---- engine/fraction.mjs ---- */

// @ts-check
/**
 * Exact rational arithmetic for division-of-interest math.
 *
 * Title decimals MUST sum to exactly 1.00000000. Binary floating point cannot
 * represent 1/3, 1/7, 3/16, etc., so a deck built on JS numbers silently drifts
 * (e.g. 0.99999999 or 1.00000001) and an analyst chasing the missing penny is a
 * real, recurring division-order defect. We therefore carry every interest as a
 * reduced BigInt fraction and only round to a decimal string at the display edge.
 */

/** @param {bigint} a @param {bigint} b @returns {bigint} */
function gcd(a, b) {
  a = a < 0n ? -a : a;
  b = b < 0n ? -b : b;
  while (b) {
    [a, b] = [b, a % b];
  }
  return a;
}

class Fraction {
  /** @type {bigint} */ n;
  /** @type {bigint} */ d;

  /**
   * @param {bigint} numerator
   * @param {bigint} [denominator]
   */
  constructor(numerator, denominator = 1n) {
    if (denominator === 0n) throw new Error('Fraction: denominator cannot be zero');
    // Normalize sign onto the numerator.
    if (denominator < 0n) {
      numerator = -numerator;
      denominator = -denominator;
    }
    const g = gcd(numerator, denominator) || 1n;
    this.n = numerator / g;
    this.d = denominator / g;
  }

  /**
   * Coerce a Fraction | bigint | integer-number | string into a Fraction.
   * Strings accept "3", "1/4", "3/16", "0.25", "-0.0625".
   * @param {Fraction|bigint|number|string} v
   * @returns {Fraction}
   */
  static from(v) {
    if (v instanceof Fraction) return v;
    if (typeof v === 'bigint') return new Fraction(v, 1n);
    if (typeof v === 'number') {
      if (!Number.isInteger(v)) {
        // Defer to the string parser so we go through exact decimal handling.
        return Fraction.from(v.toString());
      }
      return new Fraction(BigInt(v), 1n);
    }
    if (typeof v === 'string') {
      const s = v.trim();
      if (s.includes('/')) {
        const [a, b] = s.split('/');
        return new Fraction(BigInt(a.trim()), BigInt(b.trim()));
      }
      if (s.includes('.')) {
        const neg = s.startsWith('-');
        const body = neg ? s.slice(1) : s;
        const [intPart, fracPart = ''] = body.split('.');
        const denom = 10n ** BigInt(fracPart.length);
        const num = BigInt((intPart || '0') + fracPart);
        return new Fraction(neg ? -num : num, denom);
      }
      return new Fraction(BigInt(s), 1n);
    }
    throw new Error(`Fraction.from: unsupported value ${String(v)}`);
  }

  static get ZERO() { return new Fraction(0n, 1n); }
  static get ONE() { return new Fraction(1n, 1n); }

  /** @param {Fraction|bigint|number|string} o */ add(o) { const f = Fraction.from(o); return new Fraction(this.n * f.d + f.n * this.d, this.d * f.d); }
  /** @param {Fraction|bigint|number|string} o */ sub(o) { const f = Fraction.from(o); return new Fraction(this.n * f.d - f.n * this.d, this.d * f.d); }
  /** @param {Fraction|bigint|number|string} o */ mul(o) { const f = Fraction.from(o); return new Fraction(this.n * f.n, this.d * f.d); }
  /** @param {Fraction|bigint|number|string} o */ div(o) { const f = Fraction.from(o); if (f.n === 0n) throw new Error('Fraction: divide by zero'); return new Fraction(this.n * f.d, this.d * f.n); }
  neg() { return new Fraction(-this.n, this.d); }

  /** @param {Fraction|bigint|number|string} o @returns {-1|0|1} */
  cmp(o) {
    const f = Fraction.from(o);
    const lhs = this.n * f.d;
    const rhs = f.n * this.d;
    return lhs < rhs ? -1 : lhs > rhs ? 1 : 0;
  }
  /** @param {Fraction|bigint|number|string} o */ eq(o) { return this.cmp(o) === 0; }
  /** @param {Fraction|bigint|number|string} o */ lt(o) { return this.cmp(o) < 0; }
  /** @param {Fraction|bigint|number|string} o */ lte(o) { return this.cmp(o) <= 0; }
  /** @param {Fraction|bigint|number|string} o */ gt(o) { return this.cmp(o) > 0; }
  /** @param {Fraction|bigint|number|string} o */ gte(o) { return this.cmp(o) >= 0; }
  isZero() { return this.n === 0n; }
  /** @returns {-1|0|1} */ sign() { return this.n < 0n ? -1 : this.n > 0n ? 1 : 0; }

  /** Lossy — for charts/sorting only, never for the authoritative deck. */
  toNumber() { return Number(this.n) / Number(this.d); }

  /**
   * Round-half-up to a fixed-decimal string (the disbursement representation).
   * @param {number} [places]
   * @returns {string}
   */
  toDecimal(places = 8) {
    const sign = this.n < 0n ? '-' : '';
    const num = this.n < 0n ? -this.n : this.n;
    const scale = 10n ** BigInt(places);
    const scaled = num * scale;
    let q = scaled / this.d;
    const r = scaled % this.d;
    if (r * 2n >= this.d) q += 1n; // round half up
    const digits = q.toString().padStart(places + 1, '0');
    const cut = digits.length - places;
    const intPart = digits.slice(0, cut);
    const fracPart = digits.slice(cut);
    return places > 0 ? `${sign}${intPart}.${fracPart}` : `${sign}${intPart}`;
  }

  /** Human fraction, e.g. "1/30" or "3". */
  toFractionString() { return this.d === 1n ? this.n.toString() : `${this.n}/${this.d}`; }
  toString() { return this.toFractionString(); }
}

/**
 * Exact sum of a list of fractions.
 * @param {Array<Fraction|bigint|number|string>} items
 * @returns {Fraction}
 */
function sum(items) {
  return items.reduce((/** @type {Fraction} */ acc, it) => acc.add(it), Fraction.ZERO);
}

/* ---- engine/schema.mjs ---- */

// @ts-check
/**
 * Title Project schema — the typed domain model.
 *
 * This is the contract that document extraction writes to, the calc engine
 * validates and folds, and the UI renders. Keeping one authoritative shape is
 * what lets a non-expert front end stay honest: every decimal on screen is
 * traceable back to one of these instruments.
 *
 * Interests are expressed with whatever notation a deed actually uses
 * ("1/4", "0.25", "3/16") and parsed exactly by Fraction.from at fold time.
 */

/**
 * @typedef {'individual'|'entity'} PartyType
 * @typedef {{ id: string, name: string, type: PartyType }} Party
 */

/**
 * @typedef {Object} Tract
 * @property {string} name
 * @property {number} grossAcres
 * @property {string} legal      Full legal description.
 * @property {string} [county]
 * @property {string} [state]
 */

/**
 * A royalty interest reserved out of the mineral estate (Non-Participating
 * Royalty Interest). `basis` is the crux of most NPRI disputes:
 *  - 'fixed'    => holder gets `quantum` of gross 8/8 production, regardless of
 *                  the lease royalty (a "1/4 royalty").
 *  - 'floating' => holder gets `quantum` OF the lease royalty (a "1/4 OF royalty").
 * When the source language is ambiguous, set `ambiguous: true` and record the
 * `interpretationNote`; the curative engine will surface both readings.
 *
 * @typedef {Object} NpriReservation
 * @property {string} id
 * @property {string|number} quantum            e.g. "1/4"
 * @property {'fixed'|'floating'} basis
 * @property {boolean} [ambiguous]
 * @property {string} [interpretationNote]
 * @property {string|number} [appliesToMineralFraction]  Default "1" (whole tract).
 * @property {{ years: number, plusProduction: boolean }} [term]  Term reservation.
 * @property {Array<{ party: string, share: string|number }>} owners  Shares of THIS npri, sum to 1.
 */

/**
 * @typedef {Object} DocBase
 * @property {string} id
 * @property {string} date           ISO yyyy-mm-dd (execution or recording).
 * @property {string} [recording]    Instrument / document number.
 * @property {string} [title]        Human label for the run sheet.
 */

/**
 * Mineral / Warranty / Royalty deed conveying a participating mineral interest.
 * @typedef {DocBase & {
 *   kind: 'mineralConveyance',
 *   instrument: string,
 *   grantor: string,
 *   grantee: string,
 *   conveyMineralFraction: string|number,   Absolute fraction of the tract minerals conveyed.
 *   reservation?: NpriReservation,
 *   exactLanguage?: string
 * }} MineralConveyance
 */

/**
 * @typedef {DocBase & {
 *   kind: 'oilGasLease',
 *   lessor: string,
 *   lessee: string,
 *   royalty: string|number,
 *   primaryTermYears?: number,
 *   pughDepthNote?: string,
 *   noDeductionsNote?: string,
 *   exactLanguage?: string
 * }} OilGasLease
 */

/**
 * Assignment of the leasehold / working interest. May reserve an ORRI and may
 * recite ORRIs said to be already outstanding (which we cross-check).
 * @typedef {DocBase & {
 *   kind: 'assignment',
 *   assignor: string,
 *   assignee: string,
 *   wiFraction?: string|number,                 Absolute fraction of WI assigned (default all).
 *   statedNri?: string|number,                  NRI recited in the instrument (for cross-check).
 *   reservedOrri?: { quantum: string|number, owner: string },
 *   recitedOrri?: Array<{ quantum: string|number, owner: string, note?: string }>
 * }} Assignment
 */

/**
 * Stand-alone ORRI conveyance (carved from the leasehold/WI).
 * @typedef {DocBase & {
 *   kind: 'orriAssignment',
 *   assignor: string,
 *   assignee: string,
 *   quantum: string|number,
 *   note?: string
 * }} OrriAssignment
 */

/**
 * Affidavit of Heirship / probate distributing a decedent's interest.
 * @typedef {DocBase & {
 *   kind: 'affidavitOfHeirship',
 *   decedent: string,
 *   dateOfDeath?: string,
 *   affects: 'npri'|'mineral',
 *   npriId?: string,
 *   communityProperty?: boolean,
 *   survivingSpouse?: string,
 *   distributions: Array<{ heir: string, share: string|number }>  Shares of decedent's interest, sum to 1.
 * }} AffidavitOfHeirship
 */

/**
 * @typedef {DocBase & {
 *   kind: 'unitDesignation',
 *   unitName: string,
 *   unitAcres: number,
 *   tractAcres: number,
 *   otherTracts?: Array<{ name: string, acres: number }>
 * }} UnitDesignation
 */

/**
 * @typedef {DocBase & {
 *   kind: 'completionReport',
 *   well: string,
 *   intervalTopFt?: number,
 *   intervalBottomFt?: number
 * }} CompletionReport
 */

/**
 * @typedef {MineralConveyance|OilGasLease|Assignment|OrriAssignment|AffidavitOfHeirship|UnitDesignation|CompletionReport} TitleDocument
 */

/**
 * @typedef {Object} TitleProject
 * @property {string} name
 * @property {Tract} tract
 * @property {string} rootOwner            Party id that holds 100% of minerals at time zero.
 * @property {Party[]} parties
 * @property {TitleDocument[]} documents   Will be processed in chronological order.
 * @property {string} [asOfDate]
 */

/** Document kinds, exported for UI menus / validation. */
const DOC_KINDS = /** @type {const} */ ([
  'mineralConveyance',
  'oilGasLease',
  'assignment',
  'orriAssignment',
  'affidavitOfHeirship',
  'unitDesignation',
  'completionReport',
]);

/**
 * Lightweight structural validation. Returns a list of human-readable problems;
 * empty array means the project is well-formed enough to fold.
 * @param {TitleProject} project
 * @returns {string[]}
 */
function validateProject(project) {
  /** @type {string[]} */
  const errors = [];
  if (!project.tract) errors.push('Project is missing a tract.');
  const ids = new Set((project.parties || []).map((p) => p.id));
  if (!ids.has(project.rootOwner)) errors.push(`rootOwner "${project.rootOwner}" is not a declared party.`);

  const ref = (/** @type {string|undefined} */ id, /** @type {string} */ where) => {
    if (id && !ids.has(id)) errors.push(`Unknown party "${id}" referenced in ${where}.`);
  };

  for (const d of project.documents || []) {
    if (!DOC_KINDS.includes(/** @type {any} */ (d.kind))) {
      errors.push(`Document ${d.id}: unknown kind "${d.kind}".`);
      continue;
    }
    switch (d.kind) {
      case 'mineralConveyance':
        ref(d.grantor, `${d.id}.grantor`);
        ref(d.grantee, `${d.id}.grantee`);
        (d.reservation?.owners || []).forEach((o) => ref(o.party, `${d.id}.reservation.owners`));
        break;
      case 'oilGasLease':
        ref(d.lessor, `${d.id}.lessor`);
        ref(d.lessee, `${d.id}.lessee`);
        break;
      case 'assignment':
        ref(d.assignor, `${d.id}.assignor`);
        ref(d.assignee, `${d.id}.assignee`);
        if (d.reservedOrri) ref(d.reservedOrri.owner, `${d.id}.reservedOrri.owner`);
        (d.recitedOrri || []).forEach((o) => ref(o.owner, `${d.id}.recitedOrri`));
        break;
      case 'orriAssignment':
        ref(d.assignor, `${d.id}.assignor`);
        ref(d.assignee, `${d.id}.assignee`);
        break;
      case 'affidavitOfHeirship':
        ref(d.decedent, `${d.id}.decedent`);
        if (d.survivingSpouse) ref(d.survivingSpouse, `${d.id}.survivingSpouse`);
        d.distributions.forEach((dist) => ref(dist.heir, `${d.id}.distributions`));
        break;
      default:
        break;
    }
  }
  return errors;
}

// @ts-check
/**
 * Division-of-Interest engine.
 *
 * The engine is a deterministic fold over chronologically-ordered title
 * instruments. It maintains two independent ledgers — the mineral/royalty estate
 * and the leasehold/working-interest estate — because once a lease is granted the
 * royalty side (who owns the minerals) and the cost-bearing side (who owns the
 * WI) evolve separately. From the final state it derives the Division of Interest
 * (DOI) deck using exact rational arithmetic, then runs a curative rule set to
 * flag the judgment calls a human landman must confirm.
 *
 * The LLM/extraction layer is responsible for turning documents into the typed
 * schema; ALL arithmetic lives here so decimals can never be hallucinated.
 */


/**
 * @typedef {import('./schema.mjs').TitleProject} TitleProject
 * @typedef {import('./schema.mjs').TitleDocument} TitleDocument
 */

const SEVERITY = /** @type {const} */ ({ CRITICAL: 'critical', HIGH: 'high', MEDIUM: 'medium', INFO: 'info' });

/** @param {Map<string, Fraction>} m @param {string} k @param {Fraction} delta */
function addTo(m, k, delta) {
  const cur = m.get(k) || Fraction.ZERO;
  const next = cur.add(delta);
  if (next.isZero()) m.delete(k);
  else m.set(k, next);
}

/**
 * Build the chronological run sheet (Step 1) and the folded end state.
 * @param {TitleProject} project
 */
function foldDocuments(project) {
  const partyName = (/** @type {string} */ id) =>
    project.parties.find((p) => p.id === id)?.name || id;

  /** @type {Map<string, Fraction>} participating mineral ownership (sums to 1) */
  const minerals = new Map([[project.rootOwner, Fraction.ONE]]);
  /** @type {Array<any>} carved royalty interests */
  const npris = [];
  /** @type {any} */ let lease = null;
  /** @type {Map<string, Fraction>} working-interest ownership (sums to 1) */
  const wi = new Map();
  /** @type {Array<any>} override royalties on the leasehold */
  const orris = [];
  /** @type {any} */ let unit = null;
  /** @type {any} */ let production = null;
  /** @type {Array<any>} */ const runSheet = [];
  /** @type {Array<any>} */ const foldFlags = [];

  const docs = [...project.documents].sort((a, b) => a.date.localeCompare(b.date));

  for (const d of docs) {
    /** @type {string[]} */ const effects = [];

    switch (d.kind) {
      case 'mineralConveyance': {
        const frac = F(d.conveyMineralFraction);
        const held = minerals.get(d.grantor) || Fraction.ZERO;
        if (frac.gt(held)) {
          foldFlags.push({
            severity: SEVERITY.CRITICAL,
            code: 'OVER_CONVEYANCE',
            title: `Over-conveyance in ${d.id}`,
            detail: `${partyName(d.grantor)} conveyed ${frac.toFractionString()} mineral interest but held only ${held.toFractionString()}.`,
          });
        }
        addTo(minerals, d.grantor, frac.neg());
        addTo(minerals, d.grantee, frac);
        effects.push(`Minerals: ${frac.toFractionString()} from ${partyName(d.grantor)} → ${partyName(d.grantee)}.`);

        if (d.reservation) {
          const r = d.reservation;
          const owners = (r.owners || []).map((o) => ({ party: o.party, share: F(o.share) }));
          const ownerSum = sum(owners.map((o) => o.share));
          if (!ownerSum.eq(1)) {
            foldFlags.push({
              severity: SEVERITY.HIGH,
              code: 'NPRI_OWNER_SUM',
              title: `NPRI owner shares do not sum to 1 (${d.id})`,
              detail: `Owner shares total ${ownerSum.toFractionString()}.`,
            });
          }
          npris.push({
            id: r.id,
            quantum: F(r.quantum),
            basis: r.basis,
            ambiguous: !!r.ambiguous,
            interpretationNote: r.interpretationNote,
            appliesTo: r.appliesToMineralFraction != null ? F(r.appliesToMineralFraction) : Fraction.ONE,
            term: r.term,
            heldByProduction: false,
            owners,
            sourceDoc: d.id,
          });
          effects.push(`Reserved ${F(r.quantum).toFractionString()} ${r.basis} NPRI (${r.id}).`);
        }
        break;
      }

      case 'oilGasLease': {
        const leasedFraction = minerals.get(d.lessor) || Fraction.ZERO;
        lease = {
          id: d.id,
          lessor: d.lessor,
          lessee: d.lessee,
          royalty: F(d.royalty),
          coversMineralFraction: leasedFraction,
          pughDepthNote: d.pughDepthNote,
          noDeductionsNote: d.noDeductionsNote,
          primaryTermYears: d.primaryTermYears,
          date: d.date,
        };
        wi.clear();
        wi.set(d.lessee, Fraction.ONE);
        effects.push(`Lease granted at ${F(d.royalty).toFractionString()} royalty; 100% WI → ${partyName(d.lessee)}.`);
        break;
      }

      case 'assignment': {
        const frac = d.wiFraction != null ? F(d.wiFraction) : Fraction.ONE;
        const held = wi.get(d.assignor) || Fraction.ZERO;
        if (frac.gt(held)) {
          foldFlags.push({
            severity: SEVERITY.CRITICAL,
            code: 'OVER_ASSIGNMENT',
            title: `Over-assignment of WI in ${d.id}`,
            detail: `${partyName(d.assignor)} assigned ${frac.toFractionString()} WI but held ${held.toFractionString()}.`,
          });
        }
        addTo(wi, d.assignor, frac.neg());
        addTo(wi, d.assignee, frac);
        effects.push(`WI: ${frac.toFractionString()} from ${partyName(d.assignor)} → ${partyName(d.assignee)}.`);

        if (d.reservedOrri) {
          orris.push({ id: `${d.id}-orri`, quantum: F(d.reservedOrri.quantum), owner: d.reservedOrri.owner, sourceDoc: d.id, note: 'Reserved in assignment' });
          effects.push(`ORRI ${F(d.reservedOrri.quantum).toFractionString()} reserved by ${partyName(d.reservedOrri.owner)}.`);
        }
        // Cross-check recited (allegedly pre-existing) ORRIs against what we've actually seen.
        for (const rec of d.recitedOrri || []) {
          const exists = orris.some((o) => o.owner === rec.owner && o.quantum.eq(F(rec.quantum)));
          if (!exists) {
            foldFlags.push({
              severity: SEVERITY.HIGH,
              code: 'ORRI_RECITAL_GAP',
              title: `Recited ORRI not yet of record (${d.id})`,
              detail: `${d.id} recites a ${F(rec.quantum).toFractionString()} ORRI to ${partyName(rec.owner)} as already outstanding${rec.note ? ` ("${rec.note}")` : ''}, but no such conveyance appears at or before ${d.date}.`,
              recital: { quantum: rec.quantum, owner: rec.owner },
            });
          }
        }
        break;
      }

      case 'orriAssignment': {
        orris.push({ id: d.id, quantum: F(d.quantum), owner: d.assignee, sourceDoc: d.id, note: d.note });
        effects.push(`ORRI ${F(d.quantum).toFractionString()} conveyed ${partyName(d.assignor)} → ${partyName(d.assignee)}.`);
        break;
      }

      case 'affidavitOfHeirship': {
        const target = d.affects === 'npri'
          ? npris.find((n) => n.id === d.npriId) || npris[0]
          : null;
        const dists = d.distributions.map((x) => ({ heir: x.heir, share: F(x.share) }));
        const distSum = sum(dists.map((x) => x.share));
        if (!distSum.eq(1)) {
          foldFlags.push({
            severity: SEVERITY.HIGH,
            code: 'HEIRSHIP_SUM',
            title: `Heirship distributions do not sum to 1 (${d.id})`,
            detail: `Distributions total ${distSum.toFractionString()}.`,
          });
        }
        if (target) {
          /** @type {Map<string, Fraction>} */
          const own = new Map(target.owners.map((/** @type {any} */ o) => [o.party, o.share]));
          const decedentShare = own.get(d.decedent) || Fraction.ZERO;
          own.delete(d.decedent);
          for (const x of dists) addTo(own, x.heir, decedentShare.mul(x.share));
          target.owners = [...own.entries()].map(([party, share]) => ({ party, share }));
          effects.push(`Distributed ${partyName(d.decedent)}'s ${decedentShare.toFractionString()} NPRI share among ${dists.length} heir(s).`);
        }
        break;
      }

      case 'unitDesignation': {
        unit = { name: d.unitName, unitAcres: d.unitAcres, tractAcres: d.tractAcres, otherTracts: d.otherTracts || [] };
        effects.push(`Tract pooled into ${d.unitName} (${d.tractAcres}/${d.unitAcres} ac).`);
        break;
      }

      case 'completionReport': {
        production = { well: d.well, top: d.intervalTopFt, bottom: d.intervalBottomFt, date: d.date };
        for (const n of npris) if (n.term) n.heldByProduction = true;
        effects.push(`First production established (${d.well}); term interests held by production.`);
        break;
      }

      default:
        break;
    }

    runSheet.push({ ...d, effects });
  }

  return { minerals, npris, lease, wi, orris, unit, production, runSheet, foldFlags, partyName };
}

/**
 * Derive the DOI deck (Step 4) from folded state, with an exact balance proof.
 * @param {ReturnType<typeof foldDocuments>} state
 */
function buildDoi(state) {
  const { lease, minerals, npris, wi, orris, unit, partyName } = state;
  if (!lease) throw new Error('No oil & gas lease found — DOI requires an active lease.');

  const royalty = lease.royalty; // lessor royalty, e.g. 1/5
  /** @type {Array<any>} */ const rows = [];

  // --- Royalty estate: NPRIs carve off the top, minerals share the remainder ---
  let totalNpri = Fraction.ZERO;
  for (const n of npris) {
    const perProduction = (n.basis === 'floating' ? n.quantum.mul(royalty) : n.quantum).mul(n.appliesTo);
    totalNpri = totalNpri.add(perProduction);
    for (const o of n.owners) {
      rows.push({
        owner: partyName(o.party),
        partyId: o.party,
        type: 'Royalty (NPRI)',
        fraction: o.share,
        fractionLabel: `${o.share.toFractionString()} of ${n.quantum.toFractionString()} NPRI`,
        nri: o.share.mul(perProduction),
        source: n.sourceDoc,
      });
    }
  }

  const mineralRoyaltyPool = royalty.sub(totalNpri);
  if (mineralRoyaltyPool.sign() < 0) {
    // Fixed NPRI larger than the lease royalty — economically impossible to satisfy.
    state.foldFlags.push({
      severity: SEVERITY.CRITICAL,
      code: 'NPRI_EXCEEDS_ROYALTY',
      title: 'NPRI burden exceeds the lease royalty',
      detail: `Carved royalty (${totalNpri.toFractionString()}) is larger than the lease royalty (${royalty.toFractionString()}), leaving the mineral owners a negative royalty. The NPRI is almost certainly a "fraction OF royalty" (floating), not a fixed fraction of 8/8.`,
    });
  }
  for (const [party, mf] of minerals.entries()) {
    rows.push({
      owner: partyName(party),
      partyId: party,
      type: 'Mineral (Lessor Royalty)',
      fraction: mf,
      fractionLabel: `${mf.toFractionString()} minerals × ${mineralRoyaltyPool.toFractionString()} net royalty`,
      nri: mf.mul(mineralRoyaltyPool),
      source: lease.id,
    });
  }

  // --- Leasehold estate: ORRIs carve off the WI, the WI owners net the rest ---
  const wiGross = Fraction.ONE.sub(royalty); // 8/8 − royalty
  let totalOrri = Fraction.ZERO;
  for (const o of orris) {
    totalOrri = totalOrri.add(o.quantum);
    rows.push({
      owner: partyName(o.owner),
      partyId: o.owner,
      type: 'ORRI',
      fraction: o.quantum,
      fractionLabel: `${o.quantum.toFractionString()} of 8/8`,
      nri: o.quantum,
      source: o.sourceDoc,
    });
  }
  const wiNet = wiGross.sub(totalOrri);
  for (const [party, wf] of wi.entries()) {
    rows.push({
      owner: partyName(party),
      partyId: party,
      type: 'Working Interest (NRI)',
      fraction: wf,
      fractionLabel: `${wf.toFractionString()} WI`,
      nri: wf.mul(wiNet),
      source: lease.id,
    });
  }

  const total = sum(rows.map((r) => r.nri));
  const balances = total.eq(1);

  // Unit allocation factor (Step 4B).
  const unitFactor = unit ? new Fraction(BigInt(Math.round(unit.tractAcres * 1e6)), BigInt(Math.round(unit.unitAcres * 1e6))) : Fraction.ONE;
  for (const r of rows) r.unitNri = r.nri.mul(unitFactor);

  return {
    rows,
    royalty,
    totalNpri,
    mineralRoyaltyPool,
    wiGross,
    totalOrri,
    wiNet,
    total,
    balances,
    unit,
    unitFactor,
  };
}

/**
 * Curative / defect rules (Step 5) — the judgment calls that need a human.
 * @param {ReturnType<typeof foldDocuments>} state
 * @param {ReturnType<typeof buildDoi>} doi
 */
function runCurative(state, doi) {
  /** @type {Array<any>} */ const flags = [...state.foldFlags];
  const { lease, npris, minerals, partyName } = state;

  // 1. NPRI fixed-vs-floating interpretation risk.
  for (const n of npris) {
    if (n.ambiguous) {
      const floating = n.quantum.mul(lease.royalty).mul(n.appliesTo);
      const fixed = n.quantum.mul(n.appliesTo);
      flags.push({
        severity: SEVERITY.CRITICAL,
        code: 'NPRI_INTERPRETATION',
        title: `NPRI "fraction vs. fraction-of-royalty" ambiguity (${n.id})`,
        detail: `Reserved as "${n.quantum.toFractionString()}". Floating reading = ${floating.toDecimal()} (${floating.toFractionString()}); fixed reading = ${fixed.toDecimal()} (${fixed.toFractionString()}). Engine used the **${n.basis}** reading${n.interpretationNote ? ` — ${n.interpretationNote}` : ''}. Obtain a stipulation/correction before disbursing; impact is ${fixed.div(floating.isZero() ? Fraction.ONE : floating).toDecimal(2)}×.`,
      });
    }
  }

  // 2. WI NRI recited in an assignment vs. engine-computed net WI NRI.
  for (const d of state.runSheet) {
    if (d.kind === 'assignment' && d.statedNri != null) {
      const stated = F(d.statedNri);
      if (!stated.eq(doi.wiNet)) {
        flags.push({
          severity: SEVERITY.HIGH,
          code: 'WI_NRI_MISMATCH',
          title: `Assignment NRI recital differs from computed WI NRI (${d.id})`,
          detail: `${d.id} recites ${stated.toDecimal()} NRI, but after the ${doi.totalOrri.toDecimal()} ORRI burden the net working-interest NRI computes to ${doi.wiNet.toDecimal()}. The recited figure is the lease NRI before ORRI; pay on ${doi.wiNet.toDecimal()}.`,
        });
      }
    }
  }

  // 3. Reliance on an Affidavit of Heirship rather than probate.
  for (const d of state.runSheet) {
    if (d.kind === 'affidavitOfHeirship') {
      flags.push({
        severity: SEVERITY.MEDIUM,
        code: 'HEIRSHIP_RELIANCE',
        title: `Title relies on Affidavit of Heirship (${d.id})`,
        detail: `Heirs of ${partyName(d.decedent)} take by affidavit, not adjudication. Confirm (a) no will, (b) the interest's ${d.communityProperty ? 'community' : 'separate'} characterization, and (c) that all listed heirs are the decedent's only heirs (esp. children of the surviving spouse) before treating title as marketable.`,
      });
    }
  }

  // 4. Term NPRI expiration / held-by-production monitoring.
  for (const n of npris) {
    if (n.term) {
      flags.push({
        severity: n.heldByProduction ? SEVERITY.MEDIUM : SEVERITY.HIGH,
        code: 'TERM_NPRI',
        title: `Term NPRI maintenance (${n.id})`,
        detail: `Reserved for ${n.term.years} years${n.term.plusProduction ? ' and so long as production continues' : ''}. Currently ${n.heldByProduction ? 'held by production' : 'NOT shown as held by production'}. A cessation beyond the lease/continuous-development limits could terminate it and revert the royalty to the mineral owners.`,
      });
    }
  }

  // 5. Pugh / depth severance.
  if (lease.pughDepthNote) {
    flags.push({
      severity: SEVERITY.MEDIUM,
      code: 'PUGH_DEPTH',
      title: 'Depth severance via Pugh clause',
      detail: `${lease.pughDepthNote} Rights below the maintained interval are released/open and are NOT covered by this deck.`,
    });
  }

  // 6. Unit allocation incomplete (other tracts' ownership unknown).
  if (state.unit && (state.unit.otherTracts || []).length > 0) {
    const acres = state.unit.otherTracts.map((/** @type {any} */ t) => `${t.name} (${t.acres} ac)`).join(', ');
    flags.push({
      severity: SEVERITY.MEDIUM,
      code: 'UNIT_INCOMPLETE',
      title: 'Unit deck incomplete — other tracts unmodeled',
      detail: `This deck covers the subject tract only (participation ${doi.unitFactor.toDecimal()}). Ownership for ${acres} was not provided, so a full ${state.unit.name} well deck cannot be closed. Confirm the unit's allocation method (surface acreage assumed).`,
    });
  }

  // 7. Shared executive rights after a mineral split.
  if (minerals.size > 1) {
    flags.push({
      severity: SEVERITY.INFO,
      code: 'SHARED_EXECUTIVE',
      title: 'Executive rights are shared',
      detail: `${minerals.size} parties now own participating minerals (${[...minerals.keys()].map(partyName).join(', ')}). Any future lease, amendment, or ratification needs all executive owners; the existing producing lease is unaffected.`,
    });
  }

  // 8. Decimal-rounding disclosure.
  flags.push({
    severity: SEVERITY.INFO,
    code: 'ROUNDING',
    title: 'Decimal rounding disclosure',
    detail: 'Internal math is exact (rational). Displayed 8-place decimals are round-half-up and may differ from the exact total by ±0.00000001 per owner; the authoritative sum is exactly 1.00000000.',
  });

  const order = { critical: 0, high: 1, medium: 2, info: 3 };
  flags.sort((a, b) => order[a.severity] - order[b.severity]);
  return flags;
}

/**
 * Run the full 5-step analysis.
 * @param {TitleProject} project
 */
function analyzeTitleProject(project) {
  const errors = validateProject(project);
  if (errors.length) throw new Error(`Invalid Title Project:\n - ${errors.join('\n - ')}`);

  const state = foldDocuments(project);
  const doi = buildDoi(state);
  const curative = runCurative(state, doi);

  return {
    project: { name: project.name, tract: project.tract, asOfDate: project.asOfDate },
    runSheet: state.runSheet,
    ownership: {
      minerals: [...state.minerals.entries()].map(([party, f]) => ({ party, name: state.partyName(party), fraction: f })),
      npris: state.npris.map((/** @type {any} */ n) => ({
        id: n.id,
        quantum: n.quantum,
        basis: n.basis,
        owners: n.owners.map((/** @type {any} */ o) => ({ party: o.party, name: state.partyName(o.party), share: o.share })),
      })),
      wi: [...state.wi.entries()].map(([party, f]) => ({ party, name: state.partyName(party), fraction: f })),
      orris: state.orris.map((/** @type {any} */ o) => ({ id: o.id, owner: o.owner, name: state.partyName(o.owner), quantum: o.quantum })),
    },
    lease: state.lease && {
      id: state.lease.id,
      lessee: state.partyName(state.lease.lessee),
      royalty: state.lease.royalty,
      pughDepthNote: state.lease.pughDepthNote,
      noDeductionsNote: state.lease.noDeductionsNote,
    },
    unit: state.unit,
    doi,
    curative,
  };
}

// @ts-check

/* ---- web/app.js ---- */

// @ts-check
/*
 * SMEPro DOI Builder — UI layer.
 *
 * This file is engine-agnostic in spirit: it reads ONLY the result object returned
 * by analyzeTitleProject() and renders the five steps. It performs no title math.
 *
 * In the single-file build, `analyzeTitleProject`, `bentonMorales`, and `Fraction`
 * are concatenated into scope ahead of this file. In dev (module mode) they are
 * attached to window.SMEPRO by index.html. We resolve from either location.
 */
const ENGINE = (typeof analyzeTitleProject !== 'undefined')
  ? { analyzeTitleProject, project: bentonMorales }
  : window.SMEPRO;

const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const $ = (sel, root = document) => root.querySelector(sel);

let BASIS = 'tract'; // 'tract' | 'unit'
const RESULT = ENGINE.analyzeTitleProject(ENGINE.project);

/* ----------------------------------------------------------- Run sheet ----- */
function renderRunSheet(r) {
  const items = r.runSheet.map((d) => {
    const lang = d.exactLanguage ? `<div class="tl-lang">“${esc(d.exactLanguage)}”</div>` : '';
    const effects = (d.effects || []).map((e) => `<li>${esc(e)}</li>`).join('');
    const rec = d.recording ? ` · <span class="src">${esc(d.recording)}</span>` : '';
    return `<div class="tl-item">
      <div class="tl-date">${esc(d.date)}${rec}</div>
      <div class="tl-title">${esc(d.title || d.id)}</div>
      <div class="tl-meta">${esc(prettyKind(d.kind))}</div>
      <ul class="tl-effects">${effects}</ul>
      ${lang}
    </div>`;
  }).join('');
  return `<div class="card"><div class="card__title">Chronological Run Sheet · ${r.runSheet.length} instruments</div>
    <div class="timeline">${items}</div></div>`;
}
function prettyKind(k) {
  return ({ mineralConveyance: 'Deed / Mineral Conveyance', oilGasLease: 'Oil & Gas Lease', assignment: 'Assignment of Lease',
    orriAssignment: 'ORRI Assignment', affidavitOfHeirship: 'Affidavit of Heirship', unitDesignation: 'Unit Designation',
    completionReport: 'Completion Report' }[k] || k);
}

/* ------------------------------------------------------- Ownership tree ----- */
function renderOwnership(r) {
  const o = r.ownership;
  const npri = o.npris[0];
  const npriOwners = npri ? npri.owners.map((x) =>
    `<div class="tree-row"><span class="nm">${esc(x.name)}</span>
       <span class="frac">${esc(x.share.toFractionString())} of NPRI</span>
       <span class="role">non-participating royalty</span></div>`).join('') : '';
  const minerals = o.minerals.map((m) =>
    `<div class="tree-row"><span class="nm">${esc(m.name)}</span>
       <span class="frac">${esc(m.fraction.toFractionString())} minerals</span>
       <span class="role">executive + royalty</span></div>`).join('');
  const wi = o.wi.map((w) =>
    `<div class="tree-row"><span class="nm">${esc(w.name)}</span>
       <span class="frac">${esc(w.fraction.toFractionString())} WI</span></div>`).join('');
  const orris = o.orris.map((x) =>
    `<div class="tree-row"><span class="nm">${esc(x.name)}</span>
       <span class="frac">${esc(x.quantum.toDecimal(4))} ORRI</span></div>`).join('');

  const royalty = r.doi.royalty, wiGross = r.doi.wiGross;
  const bar = `<div class="bar">
    <span style="width:${pct(r.doi.totalNpri)}; background:#5aa06f" title="NPRI"></span>
    <span style="width:${pct(r.doi.mineralRoyaltyPool)}; background:#2f7fc4" title="Mineral royalty"></span>
    <span style="width:${pct(r.doi.totalOrri)}; background:#c4892b" title="ORRI"></span>
    <span style="width:${pct(r.doi.wiNet)}; background:#7a6cc0" title="WI net"></span>
  </div>`;

  return `<div class="card">
    <div class="card__title">How 100% of production splits (8/8 → 1.00000000)</div>
    ${bar}
    <div class="kpi-row note">
      <span class="badge badge--ok"><span class="dot" style="background:#5aa06f"></span>NPRI ${r.doi.totalNpri.toDecimal(4)}</span>
      <span class="badge badge--info"><span class="dot" style="background:#2f7fc4"></span>Mineral royalty ${r.doi.mineralRoyaltyPool.toDecimal(4)}</span>
      <span class="badge badge--medium"><span class="dot" style="background:#c4892b"></span>ORRI ${r.doi.totalOrri.toDecimal(4)}</span>
      <span class="badge badge--info"><span class="dot" style="background:#7a6cc0"></span>WI net ${r.doi.wiNet.toDecimal(4)}</span>
    </div>
  </div>
  <div class="flow">
    <div class="card"><div class="card__title">Royalty Estate · ${royalty.toDecimal(4)} of 8/8</div>
      <div class="pool"><h4>Non-Participating Royalty (carved off the top)</h4>${npriOwners}</div>
      <div class="pool" style="margin-top:12px"><h4>Participating Minerals (share remaining royalty)</h4>${minerals}</div>
    </div>
    <div class="card"><div class="card__title">Leasehold Estate · ${wiGross.toDecimal(4)} of 8/8</div>
      <div class="pool"><h4>Overriding Royalty (carved off the WI)</h4>${orris}</div>
      <div class="pool" style="margin-top:12px"><h4>Working Interest</h4>${wi}</div>
    </div>
  </div>`;
}
function pct(frac) { return (frac.toNumber() * 100).toFixed(4) + '%'; }

/* --------------------------------------------------------- Lease step ------ */
function renderLease(r) {
  const L = r.lease;
  const rows = r.ownership.orris.map((o) =>
    `<tr><td>${esc(o.name)}</td><td>ORRI</td><td class="num">${o.quantum.toDecimal(4)}</td><td class="src">${esc(o.id)}</td></tr>`).join('');
  return `<div class="summary-grid">
      <div class="stat"><div class="stat__label">Operator / WI</div><div class="stat__value">${esc(r.ownership.wi.map(w=>w.name).join(', '))}</div></div>
      <div class="stat"><div class="stat__label">Lease Royalty</div><div class="stat__value">${L.royalty.toFractionString()}</div><div class="stat__hint">${L.royalty.toDecimal(5)}</div></div>
      <div class="stat"><div class="stat__label">Total ORRI Burden</div><div class="stat__value">${r.doi.totalOrri.toDecimal(4)}</div></div>
      <div class="stat"><div class="stat__label">Net WI NRI</div><div class="stat__value">${r.doi.wiNet.toDecimal(5)}</div><div class="stat__hint">8/8 − royalty − ORRI</div></div>
    </div>
    <div class="card"><div class="card__title">Overriding Royalty Interests</div>
      <div class="table-wrap"><table class="data"><thead><tr><th>Owner</th><th>Type</th><th>Quantum</th><th>Source</th></tr></thead>
      <tbody>${rows || '<tr><td colspan="4" class="muted">None of record.</td></tr>'}</tbody></table></div>
    </div>
    ${L.pughDepthNote ? `<div class="card"><div class="card__title">Lease provisions</div>
      <p class="tl-meta"><strong>Pugh / depth:</strong> ${esc(L.pughDepthNote)}</p>
      ${L.noDeductionsNote ? `<p class="tl-meta"><strong>Cost-bearing:</strong> ${esc(L.noDeductionsNote)}</p>` : ''}</div>` : ''}`;
}

/* ----------------------------------------------------------- DOI deck ------ */
function renderDoi(r) {
  const unit = r.unit;
  const useUnit = BASIS === 'unit' && unit;
  const rows = [...r.doi.rows].sort((a, b) => b.nri.toNumber() - a.nri.toNumber());
  const body = rows.map((row) => {
    const dec = (useUnit ? row.unitNri : row.nri).toDecimal(8);
    return `<tr>
      <td>${esc(row.owner)}</td>
      <td><span class="type-pill" data-t="${esc(row.type)}">${esc(row.type)}</span></td>
      <td class="muted">${esc(row.fractionLabel)}</td>
      <td class="num">${dec}</td>
      <td class="src">${esc(row.source)}</td>
    </tr>`;
  }).join('');
  const totalFrac = useUnit ? r.doi.unitFactor : r.doi.total;
  const totalDec = totalFrac.toDecimal(8);
  const balanced = r.doi.balances;

  return `<div class="toolbar">
      <div class="toggle">
        <button class="${BASIS==='tract'?'is-active':''}" data-basis="tract">Tract basis (8/8)</button>
        <button class="${BASIS==='unit'?'is-active':''}" data-basis="unit" ${unit?'':'disabled'}>Unit basis (×${unit?r.doi.unitFactor.toDecimal(3):'—'})</button>
      </div>
      <span class="${balanced?'badge badge--ok':'badge badge--critical'}">
        ${balanced ? '✓ Balances to exactly 1.00000000' : '✗ Does NOT balance — export blocked'}
      </span>
      <span style="flex:1"></span>
      <button class="btn" id="dl-csv">Export DOI CSV</button>
    </div>
    <div class="card" style="padding:0">
      <div class="table-wrap"><table class="data">
        <thead><tr><th>Owner Name</th><th>Interest Type</th><th>Fractional Share</th>
          <th class="num">${useUnit ? 'Unit NRI' : 'NRI'} Decimal</th><th>Source</th></tr></thead>
        <tbody>${body}</tbody>
        <tfoot><tr><td colspan="3">TOTAL ${useUnit ? '(subject tract share of unit)' : ''}</td>
          <td class="num">${totalDec}</td><td></td></tr></tfoot>
      </table></div>
    </div>
    ${useUnit ? `<p class="note">Unit basis applies the ${r.doi.unitFactor.toFractionString()} participation factor (${unit.tractAcres}/${unit.unitAcres} ac). Tracts 2 & 3 are unmodeled, so this does not close to 1.0 across the full ${esc(unit.name)}.</p>` : ''}`;
}

function toCsv(r) {
  const useUnit = BASIS === 'unit' && r.unit;
  const head = ['Owner Name', 'Interest Type', 'Fractional Share', useUnit ? 'Unit NRI Decimal' : 'NRI Decimal', 'Source'];
  const lines = [head.join(',')];
  for (const row of r.doi.rows) {
    const dec = (useUnit ? row.unitNri : row.nri).toDecimal(8);
    lines.push([row.owner, row.type, row.fractionLabel, dec, row.source]
      .map((c) => `"${String(c).replace(/"/g, '""')}"`).join(','));
  }
  lines.push(['TOTAL', '', '', (useUnit ? r.doi.unitFactor : r.doi.total).toDecimal(8), ''].map((c)=>`"${c}"`).join(','));
  return lines.join('\n');
}

/* --------------------------------------------------------- Curative -------- */
function renderCurative(r) {
  const counts = { critical: 0, high: 0, medium: 0, info: 0 };
  r.curative.forEach((c) => counts[c.severity]++);
  const chips = `<div class="toolbar">
    <span class="badge badge--critical">${counts.critical} Critical</span>
    <span class="badge badge--high">${counts.high} High</span>
    <span class="badge badge--medium">${counts.medium} Medium</span>
    <span class="badge badge--info">${counts.info} Info</span></div>`;
  const flags = r.curative.map((c) => `
    <div class="flag flag--${c.severity}"><div class="flag__rail"></div>
      <div class="flag__body">
        <div class="flag__head">
          <span class="badge badge--${c.severity}">${c.severity.toUpperCase()}</span>
          <span class="flag__title">${esc(c.title)}</span>
          <span class="flag__code">${esc(c.code)}</span>
        </div>
        <div class="flag__detail">${mdBold(esc(c.detail))}</div>
      </div></div>`).join('');
  return chips + flags;
}
function mdBold(s) { return s.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>'); }

/* ----------------------------------------------------------- Summary ------- */
function renderSummary(r) {
  return `<div class="summary-grid">
    <div class="stat"><div class="stat__label">Tract</div><div class="stat__value" style="font-size:16px">${esc(r.project.tract.name)}</div><div class="stat__hint">${r.project.tract.grossAcres} gross acres · ${esc(r.project.tract.county || '')} Co., ${esc(r.project.tract.state || '')}</div></div>
    <div class="stat"><div class="stat__label">Stakeholders</div><div class="stat__value">${r.doi.rows.length}</div><div class="stat__hint">on the DOI deck</div></div>
    <div class="stat"><div class="stat__label">Deck Balance</div><div class="stat__value">${r.doi.total.toDecimal(8)}</div><div class="stat__hint">${r.doi.balances ? '✓ exact' : '✗ unbalanced'}</div></div>
    <div class="stat"><div class="stat__label">Curative Items</div><div class="stat__value">${r.curative.length}</div><div class="stat__hint">${r.curative.filter(c=>c.severity==='critical').length} critical</div></div>
  </div>`;
}

/* ------------------------------------------------------------- Wire --------- */
const STEPS = [
  { id: 'overview',  num: '•', label: 'Overview',          render: renderSummary,   eyebrow: 'Title Project', title: (r)=>esc(r.project.name), sub: (r)=>esc(r.project.tract.legal) },
  { id: 'runsheet',  num: '1', label: 'Run Sheet',         render: renderRunSheet,  eyebrow: 'Step 1', title: ()=>'Chronological Run Sheet', sub: ()=>'Every instrument in date order, with its effect on the estate.' },
  { id: 'ownership', num: '2', label: 'Ownership Tree',    render: renderOwnership, eyebrow: 'Step 2', title: ()=>'Property Fractions & Ownership', sub: ()=>'How the original 100% mineral estate split into today’s royalty and working-interest owners.' },
  { id: 'lease',     num: '3', label: 'Lease & Royalty',   render: renderLease,     eyebrow: 'Step 3', title: ()=>'Active Lease & Royalty Analysis', sub: ()=>'The governing lease, the operator, and every overriding royalty burden.' },
  { id: 'doi',       num: '4', label: 'DOI Deck',          render: renderDoi,       eyebrow: 'Step 4', title: ()=>'Final Division of Interest', sub: ()=>'Net Revenue Interest for every stakeholder. Must sum to exactly 1.00000000.' },
  { id: 'curative',  num: '5', label: 'Curative & Defects', render: renderCurative, eyebrow: 'Step 5', title: ()=>'Title Curative & Defects', sub: ()=>'Judgment calls and gaps a landman must resolve before relying on this deck.' },
];

let ACTIVE = 'overview';
function paint() {
  const nav = STEPS.map((s) => `<div class="nav__item ${s.id===ACTIVE?'is-active':''}" data-step="${s.id}">
      <span class="nav__num">${s.num}</span>${s.label}</div>`).join('');
  $('#nav-items').innerHTML = `<div class="nav__group">Workflow</div>${nav}`;

  const s = STEPS.find((x) => x.id === ACTIVE);
  $('#main').innerHTML = `<div class="step is-active">
      <div class="step__head">
        <div class="step__eyebrow">${s.eyebrow}</div>
        <h1 class="step__title">${s.title(RESULT)}</h1>
        <p class="step__sub">${s.sub(RESULT)}</p>
      </div>
      ${s.render(RESULT)}
      <div class="disclaimer">Title-examination work product for landman/analyst review. Not a title opinion or legal advice.
        Internal arithmetic is exact (rational); displayed decimals are round-half-up to 8 places.</div>
    </div>`;
  wireStepEvents();
}
function wireStepEvents() {
  document.querySelectorAll('[data-step]').forEach((el) =>
    el.addEventListener('click', () => { ACTIVE = el.getAttribute('data-step'); paint(); }));
  document.querySelectorAll('[data-basis]').forEach((el) =>
    el.addEventListener('click', () => { if (!el.disabled) { BASIS = el.getAttribute('data-basis'); paint(); } }));
  const csv = $('#dl-csv');
  if (csv) csv.addEventListener('click', () => {
    const blob = new Blob([toCsv(RESULT)], { type: 'text/csv' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `DOI_${RESULT.project.name.replace(/[^a-z0-9]+/gi, '_')}_${BASIS}.csv`;
    a.click(); URL.revokeObjectURL(a.href);
  });
}

$('#asof').textContent = RESULT.project.asOfDate || '';
paint();

</script>
