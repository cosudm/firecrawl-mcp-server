<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>IOS+ Management Console (offline build)</title>
  <style>
/* IOS+ Management Console — Xcode-style three-pane chrome. */
:root {
  --chrome: #ececec; --chrome-2: #e6e6e6; --tb-top: #f7f7f7; --tb-bot: #dcdcdc;
  --line: #c9c9c9; --line-soft: #dededede; --ink: #1d1d1f; --muted: #7c7c80;
  --sel: #2f6fed; --sel-soft: #d9e6ff; --content: #ffffff;
  --ok: #1a7f37; --warn: #b06a00; --crit: #c0341d; --info: #5a3ec8;
  --group: #f3f4f6;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; }
body {
  font: 13px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
  color: var(--ink); background: var(--chrome); display: flex; flex-direction: column;
  -webkit-font-smoothing: antialiased;
}
button { font-family: inherit; }

/* ---------- toolbar ---------- */
.toolbar {
  height: 46px; flex: none; display: flex; align-items: center; gap: 14px; padding: 0 12px;
  background: linear-gradient(var(--tb-top), var(--tb-bot)); border-bottom: 1px solid var(--line);
}
.traffic { display: flex; gap: 8px; padding-right: 4px; }
.traffic span { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }
.traffic .r { background: #ff5f57; } .traffic .y { background: #febc2e; } .traffic .g { background: #28c840; }
.tb-run { display: flex; gap: 2px; }
.tb-btn {
  border: 0; background: transparent; color: #3a3a3c; font-size: 15px; width: 30px; height: 28px;
  border-radius: 6px; cursor: pointer;
}
.tb-btn:hover { background: rgba(0,0,0,.08); }
.tb-btn.layout { font-size: 17px; color: #6a6a6e; }
.scheme {
  display: flex; align-items: center; gap: 7px; background: rgba(0,0,0,.04); border: 1px solid rgba(0,0,0,.08);
  height: 28px; padding: 0 10px; border-radius: 6px; font-weight: 500;
}
.app-ico { background: linear-gradient(135deg,#3a8bff,#0a3d91); color: #fff; font-weight: 800; font-size: 11px;
  width: 18px; height: 18px; border-radius: 4px; display: grid; place-items: center; }
.scheme .chev { color: var(--muted); } .scheme-dest { color: #3a3a3c; }
.status {
  flex: 1; max-width: 620px; margin: 0 auto; height: 30px; background: var(--content);
  border: 1px solid var(--line); border-radius: 7px; display: flex; align-items: center; justify-content: center;
  gap: 10px; box-shadow: inset 0 1px 0 rgba(255,255,255,.6);
}
.status-main { font-weight: 600; }
.status-sub { color: var(--muted); }
.status-warn { color: var(--warn); font-weight: 600; display: inline-flex; gap: 3px; align-items: center; }
.status-warn .tri { color: var(--warn); }
.tb-right { display: flex; gap: 2px; margin-left: auto; }

/* ---------- jump bar ---------- */
.jumpbar {
  height: 27px; flex: none; display: flex; align-items: center; gap: 6px; padding: 0 14px;
  background: var(--chrome-2); border-bottom: 1px solid var(--line); color: #4a4a4e; font-size: 12px;
}
.jumpbar .crumb { display: inline-flex; align-items: center; gap: 6px; }
.jumpbar .sep { color: var(--muted); }
.jumpbar .ico { font-size: 12px; }

/* ---------- body 3-pane ---------- */
.body { flex: 1; display: flex; min-height: 0; }
.navigator { width: 258px; flex: none; background: var(--chrome); border-right: 1px solid var(--line);
  display: flex; flex-direction: column; min-height: 0; }
.inspector { width: 270px; flex: none; background: var(--chrome); border-left: 1px solid var(--line);
  display: flex; flex-direction: column; min-height: 0; }
.editor { flex: 1; min-width: 0; background: var(--content); display: flex; flex-direction: column; }
body.hide-nav .navigator { display: none; }
body.hide-insp .inspector { display: none; }

/* navigator */
.nav-icons, .insp-icons { height: 30px; display: flex; align-items: center; gap: 16px; padding: 0 14px;
  border-bottom: 1px solid var(--line-soft); color: #8a8a8e; font-size: 14px; }
.nav-icons .on, .insp-icons .on { color: var(--sel); }
.nav-tree { flex: 1; overflow: auto; padding: 6px 0; }
.nav-filter { height: 32px; border-top: 1px solid var(--line-soft); display: flex; align-items: center; padding: 0 8px; }
.nav-filter input { width: 100%; border: 1px solid var(--line); border-radius: 5px; height: 22px; padding: 0 8px;
  background: var(--content); font-size: 12px; }

.tw-group > .tw-row { font-weight: 600; }
.tw-row {
  display: flex; align-items: center; gap: 5px; height: 24px; padding: 0 8px 0 10px; cursor: pointer;
  white-space: nowrap; overflow: hidden; color: #2a2a2e; font-size: 12.5px;
}
.tw-row:hover { background: rgba(0,0,0,.05); }
.tw-row.sel { background: var(--sel); color: #fff; }
.tw-row.sel .count, .tw-row.sel .tw-ico, .tw-row.sel .dot { color: #fff; }
.tw-row .tri { width: 12px; color: var(--muted); font-size: 9px; transition: transform .1s; flex: none; }
.tw-row.collapsed .tri { transform: rotate(-90deg); }
.tw-row .tw-ico { width: 15px; text-align: center; flex: none; }
.tw-row .lbl { overflow: hidden; text-overflow: ellipsis; flex: 1; }
.tw-row .count { color: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
.tw-children { overflow: hidden; }
.tw-children .tw-row { padding-left: 30px; font-weight: 400; color: #3a3a3e; }
.tw-children .tw-children .tw-row { padding-left: 46px; }
.dot { font-size: 9px; }
.dot.Current,.dot.same,.dot.active,.dot.good { color: var(--ok); }
.dot.PendingReview,.dot.changed,.dot.new { color: var(--warn); }
.dot.Error,.dot.error { color: var(--crit); }
.dot.Unmonitored,.dot.paused,.dot.draft { color: var(--muted); }

/* ---------- editor ---------- */
.tabbar { height: 38px; flex: none; display: flex; align-items: center; justify-content: center; gap: 22px;
  border-bottom: 1px solid var(--line); background: linear-gradient(#fdfdfd,#f4f4f4); }
.tabbar button { border: 0; background: transparent; color: #51515a; font-size: 13px; font-weight: 500;
  height: 38px; cursor: pointer; border-bottom: 2px solid transparent; padding: 0 2px; }
.tabbar button:hover { color: var(--ink); }
.tabbar button.active { color: var(--sel); border-bottom-color: var(--sel); font-weight: 600; }
.editor-scroll { flex: 1; overflow: auto; padding: 20px 26px 60px; }

/* settings-style groups */
.eyebrow { color: var(--muted); font-size: 12px; margin: 0 0 14px; }
h1.title { font-size: 19px; margin: 0 0 2px; font-weight: 600; }
.group { margin: 0 0 26px; }
.group > .ghead { display: flex; align-items: center; gap: 7px; font-weight: 700; font-size: 13px;
  padding: 5px 0; border-bottom: 1px solid var(--line); margin-bottom: 0; }
.group > .ghead .tri { color: var(--muted); font-size: 10px; }
.srow { display: grid; grid-template-columns: 280px 1fr; gap: 12px; align-items: start;
  padding: 7px 8px; border-bottom: 1px solid #eeeef0; }
.srow:hover { background: #f7f9fc; }
.srow .k { color: #44454a; }
.srow .v { color: var(--ink); }
.srow .v.mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }
.srow.head { background: #f3f4f6; font-size: 11px; text-transform: uppercase; letter-spacing: .03em;
  color: var(--muted); grid-template-columns: 1fr; font-weight: 700; }

/* compact tables inside editor */
table.grid { width: 100%; border-collapse: collapse; }
table.grid th, table.grid td { text-align: left; padding: 7px 10px; border-bottom: 1px solid #eeeef0; font-size: 12.5px; vertical-align: top; }
table.grid th { font-size: 11px; text-transform: uppercase; color: var(--muted); letter-spacing: .03em; }
table.grid tr.click { cursor: pointer; }
table.grid tr.click:hover td { background: #f1f6ff; }
.num { text-align: right; font-variant-numeric: tabular-nums; }
.deck-total td { font-weight: 800; border-top: 2px solid var(--ink); }
.muted { color: var(--muted); }
a.ext { color: var(--sel); text-decoration: none; word-break: break-all; } a.ext:hover { text-decoration: underline; }

/* stat tiles (dashboard) */
.tiles { display: grid; grid-template-columns: repeat(auto-fit,minmax(150px,1fr)); gap: 12px; margin-bottom: 22px; }
.tile { border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; background: linear-gradient(#fff,#fafbfc); }
.tile .l { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .03em; }
.tile .n { font-size: 26px; font-weight: 800; margin-top: 3px; }
.tile .s { color: var(--muted); font-size: 11px; }
.tile.alert .n { color: var(--crit); } .tile.good .n { color: var(--ok); }

/* pills */
.pill { display: inline-block; font-size: 11px; font-weight: 700; padding: 1px 8px; border-radius: 999px; white-space: nowrap; }
.pill.Current,.pill.same,.pill.active,.pill.good,.pill.resolved,.pill.waived,.pill.promoted { background:#e7f6ed; color:var(--ok); }
.pill.PendingReview,.pill.changed,.pill.new { background:#fff3e0; color:var(--warn); }
.pill.Error,.pill.error { background:#fdecea; color:var(--crit); }
.pill.Unmonitored,.pill.paused,.pill.rejected,.pill.draft { background:#eceef1; color:var(--muted); }
.pill.CRITICAL,.pill.critical,.pill.BLOCK { background:#fdecea; color:var(--crit); }
.pill.HIGH,.pill.high,.pill.REVIEW { background:#fff3e0; color:var(--warn); }
.pill.MEDIUM,.pill.medium,.pill.WARN { background:#e9f0ff; color:var(--sel); }
.pill.LOW,.pill.info,.pill.ALLOW { background:#eceef1; color:var(--muted); }

/* buttons / actions */
.btn { border: 1px solid var(--line); background: linear-gradient(#fff,#f1f1f1); color: var(--ink); font-weight: 500;
  padding: 4px 12px; border-radius: 6px; cursor: pointer; font-size: 12.5px; }
.btn:hover { background: linear-gradient(#fff,#e9e9e9); }
.btn:active { background: #e2e2e2; }
.btn.primary { background: linear-gradient(#3f80ff,#2f6fed); border-color: #2a62d6; color: #fff; }
.btn.primary:hover { background: linear-gradient(#3676f5,#285fd0); }
.btn.danger { color: var(--crit); }
.btn.sm { padding: 2px 9px; font-size: 12px; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; margin: 16px 0 6px; }

/* inspector */
.insp-scroll { flex: 1; overflow: auto; padding: 12px 14px; }
.insp-sec { font-weight: 700; font-size: 12px; margin: 14px 0 8px; }
.insp-sec:first-child { margin-top: 2px; }
.ifield { margin-bottom: 9px; }
.ifield .il { color: var(--muted); font-size: 11px; margin-bottom: 2px; }
.ifield .iv { font-size: 12.5px; word-break: break-word; }
.ifield .iv.mono { font-family: ui-monospace, Menlo, monospace; font-size: 11.5px; }
.insp-empty { color: var(--muted); font-size: 12px; padding: 20px 4px; text-align: center; }

/* feed */
.feed { list-style: none; margin: 0; padding: 0; }
.feed li { display: flex; gap: 9px; padding: 7px 0; border-bottom: 1px solid #eeeef0; }
.feed li:last-child { border: 0; }
.feed .fdot { width: 7px; height: 7px; border-radius: 50%; margin-top: 5px; background: var(--sel); flex: none; }
.feed .fdot.change { background: var(--warn); } .feed .fdot.discovery { background: var(--info); }
.feed .fdot.deck,.feed .fdot.verify { background: var(--ok); } .feed .fdot.monitor { background: var(--muted); }
.feed time { color: var(--muted); font-size: 11px; display: block; }

/* toast */
.toast { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%); background: #2b2b2e; color: #fff;
  padding: 9px 16px; border-radius: 8px; z-index: 30; box-shadow: 0 4px 14px rgba(0,0,0,.25); font-size: 12.5px; }
.toast.bad { background: var(--crit); }

.cols2 { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
@media (max-width: 900px){ .cols2 { grid-template-columns: 1fr; } }

</style>

</head>
<body>
  <!-- Toolbar (Xcode-style) -->
  <div class="toolbar">
    <div class="traffic"><span class="r"></span><span class="y"></span><span class="g"></span></div>
    <div class="tb-run">
      <button id="btnRefresh" class="tb-btn" title="Refresh">▶</button>
      <button id="btnReset" class="tb-btn" title="Reset demo data">■</button>
    </div>
    <div class="scheme">
      <span class="app-ico">I+</span>
      <span class="scheme-name">IOS+ Console</span>
      <span class="chev">›</span>
      <span class="scheme-dest" id="operator">op1 · operator</span>
    </div>
    <div class="status" id="statusbar">
      <span class="status-main">Operational</span>
      <span class="status-sub" id="statusSub">loading…</span>
      <span class="status-warn" id="statusWarn" hidden><span class="tri">⚠</span> <em>0</em></span>
    </div>
    <div class="tb-right">
      <button id="togNav" class="tb-btn layout" title="Hide/show navigator">◧</button>
      <button id="togInsp" class="tb-btn layout" title="Hide/show inspector">◨</button>
    </div>
  </div>

  <!-- Jump bar -->
  <div class="jumpbar" id="jumpbar"></div>

  <!-- Body: navigator | editor | inspector -->
  <div class="body">
    <aside class="navigator" id="navigator">
      <div class="nav-icons"><span class="on">▤</span><span>⚑</span><span>⚠</span><span>◷</span></div>
      <div class="nav-tree" id="navTree"></div>
      <div class="nav-filter"><input id="navFilter" type="search" placeholder="Filter" /></div>
    </aside>

    <main class="editor" id="editor">
      <div class="tabbar" id="tabbar">
        <button data-section="dashboard" class="active">Dashboard</button>
        <button data-section="compliance">Compliance</button>
        <button data-section="discovery">Discovery</button>
        <button data-section="decks">DOI Decks</button>
        <button data-section="monitors">Monitors</button>
      </div>
      <div class="editor-scroll" id="editorBody"></div>
    </main>

    <aside class="inspector" id="inspector">
      <div class="insp-icons"><span class="on">𝓲</span><span>?</span></div>
      <div class="insp-scroll" id="inspBody"></div>
    </aside>
  </div>

  <div id="toast" class="toast" hidden></div>
  <script type="module">

// @ts-check
/**
 * Pure store logic — no filesystem, no seed import — so it runs identically in
 * Node (behind lib/store.mjs) and in the browser (behind the single-file build).
 *
 * Construct with an initial state plus hooks:
 *   new StoreCore(state, { clock, seedFn, save })
 *     clock  : () => ISO string      (timestamps)
 *     seedFn : () => ConsoleState    (used by reset())
 *     save   : (state) => void       (persistence side-effect; optional)
 */
let seq = 1000;
const uid = (p) => `${p}-${++seq}`;

class StoreCore {
  constructor(state, { clock, seedFn, save } = {}) {
    /** @type {any} */
    this.state = state;
    this.clock = clock || (() => new Date().toISOString());
    this.seedFn = seedFn || (() => this.state);
    this._saveHook = save || null;
  }
  _save() { if (this._saveHook) this._saveHook(this.state); }

  reset() { this.state = this.seedFn(); this._save(); return this.state; }

  // ---- dashboard ----------------------------------------------------------
  dashboard() {
    const s = this.state;
    const byStatus = {}, byTier = {};
    for (const o of s.obligations) {
      byStatus[o.compliance_status] = (byStatus[o.compliance_status] || 0) + 1;
      byTier[o.risk_tier] = (byTier[o.risk_tier] || 0) + 1;
    }
    return {
      obligations: {
        total: s.obligations.length, byStatus, byTier,
        pendingReview: s.obligations.filter((o) => o.compliance_status === 'Pending Review').length,
        unmonitored: s.obligations.filter((o) => o.compliance_status === 'Unmonitored').length,
      },
      monitors: {
        total: s.monitors.length,
        active: s.monitors.filter((m) => m.status === 'active').length,
        paused: s.monitors.filter((m) => m.status === 'paused').length,
        changed: s.monitors.filter((m) => m.last_status === 'changed').length,
        error: s.monitors.filter((m) => m.last_status === 'error').length,
      },
      discoveries: { total: s.discoveries.length, new: s.discoveries.filter((d) => d.status === 'new').length },
      projects: {
        total: s.projects.length,
        balanced: s.projects.filter((p) => p.balances).length,
        approved: s.projects.filter((p) => p.approved_at).length,
        openCurative: s.projects.reduce((n, p) => n + p.curative.filter((c) => c.status === 'open').length, 0),
      },
      activity: [...s.activity].slice(0, 12),
    };
  }

  _logActivity(kind, message) {
    this.state.activity.unshift({ id: uid('act'), at: this.clock(), kind, message });
    this.state.activity = this.state.activity.slice(0, 50);
  }

  // ---- obligations --------------------------------------------------------
  listObligations({ status, sheet, q } = {}) {
    let rows = this.state.obligations;
    if (status) rows = rows.filter((o) => o.compliance_status === status);
    if (sheet) rows = rows.filter((o) => o.sheet_code === sheet);
    if (q) {
      const n = q.toLowerCase();
      rows = rows.filter((o) => [o.governing_agency, o.cfr_citation, o.regulation_name, o.specific_activity, o.report_form_name]
        .filter(Boolean).some((v) => v.toLowerCase().includes(n)));
    }
    return rows;
  }
  getObligation(id) {
    const o = this.state.obligations.find((x) => x.id === id);
    if (!o) return null;
    const scans = this.state.scan_history.filter((s) => s.obligation_id === id).sort((a, b) => (a.scraped_at < b.scraped_at ? 1 : -1));
    const monitor = this.state.monitors.find((m) => m.id === o.firecrawl_monitor_id) || null;
    return { ...o, scans, monitor };
  }
  runCheck(id, { changed = false, diffSummary = null } = {}) {
    const o = this.state.obligations.find((x) => x.id === id);
    if (!o) return null;
    const at = this.clock();
    this.state.scan_history.unshift({
      id: uid('scan'), operator_id: o.operator_id, obligation_id: id, scan_kind: 'run_check',
      source_url: o.regulatory_url, scraped_at: at, changed: !!changed,
      diff_summary: changed ? (diffSummary || 'Change detected by monitor.') : null, firecrawl_tool: 'firecrawl_monitor_check',
    });
    if (changed) { o.compliance_status = 'Pending Review'; o.last_scraped_at = at; }
    else { o.compliance_status = o.compliance_status === 'Unmonitored' ? 'Unmonitored' : 'Current'; o.last_verified_at = at; o.last_scraped_at = at; }
    const mon = this.state.monitors.find((m) => m.id === o.firecrawl_monitor_id);
    if (mon) { mon.last_check_at = at; mon.last_status = changed ? 'changed' : 'same'; }
    this._logActivity(changed ? 'change' : 'verify', `Run-check on ${o.governing_agency} (${o.cfr_citation}): ${changed ? 'CHANGED → Pending Review' : 'no change'}.`);
    this._save();
    return this.getObligation(id);
  }
  acceptReview(id) {
    const o = this.state.obligations.find((x) => x.id === id);
    if (!o) return null;
    o.compliance_status = 'Current'; o.last_verified_at = this.clock();
    this._logActivity('verify', `${o.governing_agency} (${o.cfr_citation}) review accepted → Current.`);
    this._save();
    return this.getObligation(id);
  }

  // ---- discoveries --------------------------------------------------------
  listDiscoveries({ status } = {}) {
    let rows = this.state.discoveries;
    if (status) rows = rows.filter((d) => d.status === status);
    return rows;
  }
  rejectDiscovery(id) {
    const d = this.state.discoveries.find((x) => x.id === id);
    if (!d) return null;
    d.status = 'rejected'; d.reviewed_at = this.clock(); d.reviewed_by = 'console';
    this._logActivity('discovery', `Rejected discovered report: ${d.discovered_url}`);
    this._save();
    return d;
  }
  promoteDiscovery(id) {
    const d = this.state.discoveries.find((x) => x.id === id);
    if (!d) return null;
    if (d.status === 'promoted') return { discovery: d, obligation: this.getObligation(d.promoted_obligation_id) };
    const ob = {
      id: uid('ob'), operator_id: d.operator_id, sheet_code: d.suggested_sheet || '01 – ENERGY', broad_industry: 'ENERGY',
      industry_subtype: null, specific_activity: d.summary?.slice(0, 80) || 'Discovered report', jurisdiction_level: d.jurisdiction_level,
      governing_agency: d.root_domain, regulation_name: null, cfr_citation: null, report_form_name: null, form_code: null,
      filing_frequency: null, key_due_dates: null, penalties: null, risk_tier: d.risk_tier || 'MEDIUM', risk_weight: null,
      policy_action: 'REVIEW', responsible_role: null, regulatory_url: d.discovered_url, firecrawl_monitor_id: null,
      compliance_status: 'Unmonitored', last_verified_at: null,
    };
    this.state.obligations.push(ob);
    d.status = 'promoted'; d.promoted_obligation_id = ob.id; d.reviewed_at = this.clock(); d.reviewed_by = 'console';
    this._logActivity('discovery', `Promoted discovery to obligation ${ob.id} (${ob.regulatory_url}).`);
    this._save();
    return { discovery: d, obligation: this.getObligation(ob.id) };
  }

  // ---- monitors -----------------------------------------------------------
  listMonitors() { return this.state.monitors; }
  toggleMonitor(id) {
    const m = this.state.monitors.find((x) => x.id === id);
    if (!m) return null;
    m.status = m.status === 'active' ? 'paused' : 'active';
    this._logActivity('monitor', `Monitor ${id} ${m.status === 'active' ? 'resumed' : 'paused'}.`);
    this._save();
    return m;
  }

  // ---- DOI projects -------------------------------------------------------
  listProjects() {
    return this.state.projects.map((p) => ({
      id: p.id, name: p.name, unit_id: p.unit_id, tract: p.tract, basis: p.basis, total_nri: p.total_nri,
      balances: p.balances, approved_at: p.approved_at, rows: p.rows.length, openCurative: p.curative.filter((c) => c.status === 'open').length,
    }));

/**
 * REST API for the IOS+ Management Console. Pure function of (Store) → handler,
 * so the test suite can exercise it without binding a socket.
 *
 * Returns a handler: (method, pathname, query, body) => { status, json }
 * Unknown routes return { status: 404 }. Handlers never throw for client input;
 * they return a 4xx with an { error } body instead.
 */
function createApi(store) {
  /** @param {string} m @param {string} p */
  return function handle(m, p, query = {}, body = null) {
    const seg = p.replace(/^\/api\/?/, '').split('/').filter(Boolean);
    const J = (status, json) => ({ status, json });

    // /api/health
    if (m === 'GET' && p === '/api/health')
      return J(200, { ok: true, service: 'ios-console', backend: 'memory', time: new Date().toISOString() });

    // /api/dashboard
    if (m === 'GET' && p === '/api/dashboard') return J(200, store.dashboard());

    // /api/obligations ...
    if (seg[0] === 'obligations') {
      if (m === 'GET' && seg.length === 1)
        return J(200, { items: store.listObligations(query) });
      if (m === 'GET' && seg.length === 2) {
        const o = store.getObligation(seg[1]);
        return o ? J(200, o) : J(404, { error: 'not_found' });
      }
      if (m === 'POST' && seg.length === 3 && seg[2] === 'run-check') {
        const o = store.runCheck(seg[1], body || {});
        return o ? J(200, o) : J(404, { error: 'not_found' });
      }
      if (m === 'POST' && seg.length === 3 && seg[2] === 'accept') {
        const o = store.acceptReview(seg[1]);
        return o ? J(200, o) : J(404, { error: 'not_found' });
      }
    }

    // /api/discoveries ...
    if (seg[0] === 'discoveries') {
      if (m === 'GET' && seg.length === 1)
        return J(200, { items: store.listDiscoveries(query) });
      if (m === 'POST' && seg.length === 3 && seg[2] === 'promote') {
        const r = store.promoteDiscovery(seg[1]);
        return r ? J(200, r) : J(404, { error: 'not_found' });
      }
      if (m === 'POST' && seg.length === 3 && seg[2] === 'reject') {
        const r = store.rejectDiscovery(seg[1]);
        return r ? J(200, r) : J(404, { error: 'not_found' });
      }
    }

    // /api/monitors ...
    if (seg[0] === 'monitors') {
      if (m === 'GET' && seg.length === 1) return J(200, { items: store.listMonitors() });
      if (m === 'POST' && seg.length === 3 && seg[2] === 'toggle') {
        const r = store.toggleMonitor(seg[1]);
        return r ? J(200, r) : J(404, { error: 'not_found' });
      }
    }

    // /api/projects ...
    if (seg[0] === 'projects') {
      if (m === 'GET' && seg.length === 1) return J(200, { items: store.listProjects() });
      if (m === 'GET' && seg.length === 2) {
        const pr = store.getProject(seg[1]);
        return pr ? J(200, pr) : J(404, { error: 'not_found' });
      }
      if (m === 'POST' && seg.length === 3 && seg[2] === 'approve') {
        const r = store.approveProject(seg[1]);
        if (r.error === 'not_found') return J(404, r);
        if (r.error) return J(409, r); // balance / critical-curative gate
        return J(200, r);
      }
      if (m === 'POST' && seg.length === 4 && seg[2] === 'curative') {
        const c = store.resolveCurative(seg[1], seg[3], body || {});
        return c ? J(200, c) : J(404, { error: 'not_found' });
      }
    }

    // /api/admin/reset
    if (m === 'POST' && p === '/api/admin/reset') { store.reset(); return J(200, { ok: true }); }

    return J(404, { error: 'no_route', path: p });
  };
}

const cl = (s) => String(s ?? '').replace(/\s+/g, ''); // "Pending Review" -> "PendingReview" for class names
const pill = (v, label) => `<span class="pill ${cl(v)}">${esc(label ?? v)}</span>`;
const dot = (v) => `<span class="dot ${cl(v)}">●</span>`;
const fmt = (t) => (t ? new Date(t).toLocaleString(undefined, { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' }) : '—');

async function api(path, opts = {}) {
  // Inlined handler (single-file build)?
  if (typeof window !== 'undefined' && window.IOS_API) {
    const m = (opts.method || 'GET').toUpperCase();
    const u = new URL(path, 'http://x'); const q = Object.fromEntries(u.searchParams.entries());
    const body = opts.body ? JSON.parse(opts.body) : null;
    const { status, json } = window.IOS_API(m, u.pathname.replace(/^\/api/, '/api'), q, body);
    if (status >= 400) throw Object.assign(new Error(json.message || json.error || 'error'), { status, body: json });
    return json;
  }
  const res = await fetch('/api' + path, { headers: { 'content-type': 'application/json' }, ...opts });
  const json = await res.json().catch(() => ({}));
  if (!res.ok) throw Object.assign(new Error(json.message || json.error || res.statusText), { status: res.status, body: json });
  return json;
}
const get = (p) => api(p);
const post = (p, body) => api(p, { method: 'POST', body: body ? JSON.stringify(body) : undefined });

function toast(msg, bad = false) {
  const t = $('#toast'); t.textContent = msg; t.className = 'toast' + (bad ? ' bad' : ''); t.hidden = false;
  clearTimeout(toast._t); toast._t = setTimeout(() => (t.hidden = true), 2600);
}

// ---------- state ----------
const SECTIONS = ['dashboard', 'compliance', 'discovery', 'decks', 'monitors'];
const SECTION_LABEL = { dashboard: 'Dashboard', compliance: 'Compliance', discovery: 'Discovery', decks: 'DOI Decks', monitors: 'Monitors' };
const sel = { section: 'dashboard', id: null };
const collapsed = {};
let cache = {};

async function loadAll() {
  const [dash, obl, disc, proj, mon] = await Promise.all([
    get('/dashboard'), get('/obligations'), get('/discoveries'), get('/projects'), get('/monitors'),
  ]);
  cache = { dash, obligations: obl.items, discoveries: disc.items, projects: proj.items, monitors: mon.items };
  return cache;
}

// ---------- toolbar / jumpbar ----------
function renderStatus() {
  const d = cache.dash;
  $('#statusSub').textContent = `${d.obligations.total} obligations · ${d.monitors.active} monitors · ${d.projects.total} decks`;
  const warn = d.obligations.pendingReview + d.discoveries.new;
  const w = $('#statusWarn'); w.hidden = warn === 0; w.querySelector('em').textContent = warn;
}
function renderJumpbar() {
  const parts = [`<span class="crumb"><span class="ico">▤</span> IOS+ Operation</span>`,
    `<span class="sep">›</span><span class="crumb">${esc(SECTION_LABEL[sel.section])}</span>`];
  if (sel.id) {
    const nm = selectedLabel();
    if (nm) parts.push(`<span class="sep">›</span><span class="crumb">${esc(nm)}</span>`);
  }
  $('#jumpbar').innerHTML = parts.join(' ');
}
function selectedLabel() {
  if (sel.section === 'compliance') return (cache.obligations.find((o) => o.id === sel.id) || {}).governing_agency;
  if (sel.section === 'decks') return (cache.projects.find((p) => p.id === sel.id) || {}).name;
  if (sel.section === 'monitors') return sel.id;
  if (sel.section === 'discovery') { const d = cache.discoveries.find((x) => x.id === sel.id); return d && d.root_domain; }
  return null;
}

// ---------- navigator ----------
function navGroup(section, ico, children) {
  const isColl = collapsed[section];
  const items = children.filter(navMatch);
  const kids = items.map((c) => `
    <div class="tw-row ${sel.section === section && sel.id === c.id ? 'sel' : ''}" data-section="${section}" data-id="${esc(c.id)}">
      ${c.status ? dot(c.status) : '<span class="tw-ico">•</span>'}<span class="lbl">${esc(c.label)}</span>${c.meta ? `<span class="count">${esc(c.meta)}</span>` : ''}
    </div>`).join('');
  return `
    <div class="tw-group">
      <div class="tw-row ${isColl ? 'collapsed' : ''} ${sel.section === section && !sel.id ? 'sel' : ''}" data-section="${section}" data-group="1">
        <span class="tri">▼</span><span class="tw-ico">${ico}</span><span class="lbl">${SECTION_LABEL[section]}</span><span class="count">${items.length}</span>
      </div>
      <div class="tw-children" ${isColl ? 'style="display:none"' : ''}>${kids}</div>
    </div>`;
}
let navFilterText = '';
function navMatch(c) { return !navFilterText || c.label.toLowerCase().includes(navFilterText); }
function renderNavigator() {
  const obl = cache.obligations.map((o) => ({ id: o.id, label: `${o.governing_agency} — ${o.cfr_citation || o.report_form_name || ''}`.trim(), status: o.compliance_status }));
  const disc = cache.discoveries.map((d) => ({ id: d.id, label: d.root_domain, status: d.status, meta: d.risk_tier }));
  const proj = cache.projects.map((p) => ({ id: p.id, label: p.name, status: p.approved_at ? 'good' : (p.balances ? 'same' : 'Error') }));
  const mon = cache.monitors.map((m) => ({ id: m.id, label: m.id, status: m.status }));
  $('#navTree').innerHTML =
    `<div class="tw-row ${sel.section === 'dashboard' ? 'sel' : ''}" data-section="dashboard" data-group="1"><span class="tri" style="visibility:hidden">▼</span><span class="tw-ico">◫</span><span class="lbl">Dashboard</span></div>`
    + navGroup('compliance', '§', obl) + navGroup('discovery', '🔎', disc) + navGroup('decks', '▦', proj) + navGroup('monitors', '◷', mon);
  $('#navTree').querySelectorAll('.tw-row').forEach((row) => {
    row.onclick = () => {
      const s = row.dataset.section;
      if (row.dataset.group && s !== 'dashboard') {
        if (sel.section === s && !sel.id) { collapsed[s] = !collapsed[s]; }
        sel.section = s; sel.id = null;
      } else { sel.section = s; sel.id = row.dataset.id || null; }
      syncTabs(); render();
    };
  });
}

// ---------- editor ----------
function group(title, rowsHtml) { return `<div class="group"><div class="ghead"><span class="tri">▼</span>${esc(title)}</div>${rowsHtml}</div>`; }
function srow(k, v) { return `<div class="srow"><div class="k">${esc(k)}</div><div class="v">${v}</div></div>`; }

async function renderEditor() {
  const body = $('#editorBody');
  if (sel.section === 'dashboard') return renderDashboard(body);
  if (sel.id) return renderDetail(body);
  return renderSectionList(body);
}

function renderDashboard(body) {
  const d = cache.dash;
  const tile = (l, n, s, k = '') => `<div class="tile ${k}"><div class="l">${l}</div><div class="n">${n}</div><div class="s">${s}</div></div>`;
  const bars = ['Current', 'Pending Review', 'Error', 'Unmonitored'].map((k) => {
    const n = d.obligations.byStatus[k] || 0, pct = d.obligations.total ? Math.round((n / d.obligations.total) * 100) : 0;
    return `<div style="margin:9px 0"><div style="display:flex;justify-content:space-between">${pill(k)}<span class="muted">${n}</span></div>
      <div style="height:7px;background:#eceef1;border-radius:5px;margin-top:4px;overflow:hidden"><div style="width:${pct}%;height:100%;background:var(--sel)"></div></div></div>`;
  }).join('');
  body.innerHTML = `
    <p class="eyebrow">Operations overview</p><h1 class="title">Dashboard</h1>
    <div class="tiles" style="margin-top:16px">
      ${tile('Obligations', d.obligations.total, `${d.obligations.byTier.CRITICAL || 0} critical`)}
      ${tile('Pending Review', d.obligations.pendingReview, 'regulatory change', d.obligations.pendingReview ? 'alert' : '')}
      ${tile('Active Monitors', d.monitors.active, `${d.monitors.changed} flagged`)}
      ${tile('New Discoveries', d.discoveries.new, 'awaiting triage', d.discoveries.new ? 'alert' : '')}
      ${tile('DOI Decks', d.projects.total, `${d.projects.balanced} balanced · ${d.projects.approved} approved`, 'good')}
      ${tile('Open Curative', d.projects.openCurative, 'defects to cure')}
    </div>
    <div class="cols2">
      <div>${group('Compliance status', bars)}</div>
      <div><div class="group"><div class="ghead"><span class="tri">▼</span>Recent activity</div>
        <ul class="feed">${(d.activity || []).map((a) => `<li><span class="fdot ${esc(a.kind)}"></span><div>${esc(a.message)}<time>${fmt(a.at)}</time></div></li>`).join('') || '<li class="muted">No activity.</li>'}</ul></div></div>
    </div>`;
}

function renderSectionList(body) {
  if (sel.section === 'compliance') {
    const rows = cache.obligations.map((o) => `<tr class="click" data-id="${o.id}"><td><b>${esc(o.governing_agency)}</b><div class="muted">${esc(o.specific_activity || '')}</div></td>
      <td>${esc(o.cfr_citation || '—')}</td><td>${pill(o.risk_tier)}</td><td>${pill(o.policy_action)}</td><td>${pill(o.compliance_status, o.compliance_status)}</td><td class="muted">${fmt(o.last_verified_at)}</td></tr>`).join('');
    body.innerHTML = `<p class="eyebrow">Universal Compliance Decoding Matrix</p><h1 class="title">Compliance</h1>
      <div class="group" style="margin-top:14px"><table class="grid"><thead><tr><th>Agency</th><th>Citation</th><th>Risk</th><th>Policy</th><th>Status</th><th>Verified</th></tr></thead><tbody>${rows}</tbody></table></div>`;
  } else if (sel.section === 'discovery') {
    const rows = cache.discoveries.map((d) => `<tr class="click" data-id="${d.id}"><td><a class="ext" href="${esc(d.discovered_url)}" target="_blank" rel="noopener">${esc(d.discovered_url)}</a><div class="muted">${esc(d.summary || '')}</div></td>
      <td>${pill(d.risk_tier || '—')}</td><td>${esc(d.jurisdiction_level || '—')}</td><td>${pill(d.status)}</td></tr>`).join('');
    body.innerHTML = `<p class="eyebrow">Firecrawl map discoveries</p><h1 class="title">Discovery</h1>
      <div class="group" style="margin-top:14px"><table class="grid"><thead><tr><th>Discovered URL</th><th>Risk</th><th>Jurisdiction</th><th>Status</th></tr></thead><tbody>${rows}</tbody></table></div>`;
  } else if (sel.section === 'decks') {
    const rows = cache.projects.map((p) => `<tr class="click" data-id="${p.id}"><td><b>${esc(p.name)}</b></td><td class="num">${p.rows}</td><td class="num" style="font-family:ui-monospace,Menlo,monospace">${esc(p.total_nri)}</td>
      <td>${pill(p.balances ? 'good' : 'Error', p.balances ? 'balanced' : 'unbalanced')}</td><td class="num">${p.openCurative}</td><td>${p.approved_at ? pill('promoted', 'approved') : '<span class="muted">draft</span>'}</td></tr>`).join('');
    body.innerHTML = `<p class="eyebrow">Division-of-Interest decks (engine-computed)</p><h1 class="title">DOI Decks</h1>
      <div class="group" style="margin-top:14px"><table class="grid"><thead><tr><th>Project</th><th class="num">Owners</th><th class="num">Total NRI</th><th>Balanced</th><th class="num">Open curative</th><th>Approval</th></tr></thead><tbody>${rows}</tbody></table></div>`;
  } else if (sel.section === 'monitors') {
    const rows = cache.monitors.map((m) => `<tr class="click" data-id="${m.id}"><td style="font-family:ui-monospace,Menlo,monospace">${esc(m.id)}</td><td><a class="ext" href="${esc(m.url)}" target="_blank" rel="noopener">${esc(m.url)}</a></td>
      <td>${esc(m.schedule)}</td><td class="muted">${fmt(m.last_check_at)}</td><td>${pill(m.last_status)}</td><td>${pill(m.status)}</td></tr>`).join('');
    body.innerHTML = `<p class="eyebrow">Recurring server-side scrapes</p><h1 class="title">Monitors</h1>
      <div class="group" style="margin-top:14px"><table class="grid"><thead><tr><th>Monitor</th><th>URL</th><th>Schedule</th><th>Last check</th><th>Result</th><th>Status</th></tr></thead><tbody>${rows}</tbody></table></div>`;
  }
  body.querySelectorAll('tr.click').forEach((tr) => tr.onclick = () => { sel.id = tr.dataset.id; render(); });
}

async function renderDetail(body) {
  if (sel.section === 'compliance') {
    const o = await get('/obligations/' + sel.id);
    body.innerHTML = `<p class="eyebrow">${esc(o.regulation_name || 'Compliance obligation')}</p><h1 class="title">${esc(o.governing_agency)} — ${esc(o.cfr_citation || o.report_form_name || '')}</h1>
      ${group('Regulation & Filing', srow('Specific activity', esc(o.specific_activity || '—')) + srow('Report / form', `${esc(o.report_form_name || '—')} <span class="muted">${esc(o.form_code || '')}</span>`)
        + srow('Filing frequency', esc(o.filing_frequency || '—')) + srow('Key due dates', esc(o.key_due_dates || '—')) + srow('Penalties', esc(o.penalties || '—')))}
      ${group('Classification', srow('Jurisdiction', esc(o.jurisdiction_level || '—')) + srow('Risk tier', pill(o.risk_tier)) + srow('Policy action', pill(o.policy_action)) + srow('Sheet', esc(o.sheet_code || '—')))}
      ${group('Monitoring', srow('Status', pill(o.compliance_status, o.compliance_status)) + srow('Source URL', o.regulatory_url ? `<a class="ext" href="${esc(o.regulatory_url)}" target="_blank" rel="noopener">${esc(o.regulatory_url)}</a>` : '—')
        + srow('Monitor', o.monitor ? `${esc(o.monitor.id)} · ${pill(o.monitor.status)} · ${esc(o.monitor.schedule)}` : '<span class="muted">none</span>') + srow('Last verified', fmt(o.last_verified_at)))}
      <div class="actions">
        <button class="btn" data-act="rc0">Run-check · no change</button>
        <button class="btn" data-act="rc1">Run-check · changed</button>
        ${o.compliance_status === 'Pending Review' ? '<button class="btn primary" data-act="accept">Accept review → Current</button>' : ''}
      </div>
      ${group(`Scan history (${(o.scans || []).length})`, `<table class="grid"><thead><tr><th>When</th><th>Result</th><th>Summary</th></tr></thead><tbody>${(o.scans || []).map((s) => `<tr><td class="muted">${fmt(s.scraped_at)}</td><td>${pill(s.changed ? 'changed' : 'same')}</td><td>${esc(s.diff_summary || '—')}</td></tr>`).join('') || '<tr><td colspan=3 class="muted">No scans.</td></tr>'}</tbody></table>`)}`;
    body.querySelector('[data-act=rc0]').onclick = () => act(() => post(`/obligations/${sel.id}/run-check`, { changed: false }), 'Verified — no change');
    body.querySelector('[data-act=rc1]').onclick = () => act(() => post(`/obligations/${sel.id}/run-check`, { changed: true, diffSummary: 'Manual run-check flagged a change.' }), 'Change recorded → Pending Review');
    const ac = body.querySelector('[data-act=accept]'); if (ac) ac.onclick = () => act(() => post(`/obligations/${sel.id}/accept`), 'Marked Current');
  } else if (sel.section === 'decks') {
    const p = await get('/projects/' + sel.id);
    const rows = [...p.rows].sort((a, b) => Number(b.nri) - Number(a.nri))
      .map((r) => `<tr><td>${esc(r.owner)}</td><td class="muted">${esc(r.type)}</td><td class="num" style="font-family:ui-monospace,Menlo,monospace">${esc(r.nri)}</td></tr>`).join('');
    const cur = p.curative.map((c) => `<tr><td style="width:84px">${pill(c.severity)}</td><td><b>${esc(c.title)}</b><div class="muted">${esc((c.detail || '').replace(/\*\*/g, ''))}</div></td>
      <td class="num" style="width:120px">${c.status === 'open' ? `<button class="btn sm" data-cur="${c.id}">Resolve</button>` : pill(c.status)}</td></tr>`).join('');
    body.innerHTML = `<p class="eyebrow">${esc(p.tract?.legal || '')}</p><h1 class="title">${esc(p.name)}</h1>
      ${group('Deck (tract basis, 8/8)', `<table class="grid"><thead><tr><th>Owner</th><th>Type</th><th class="num">NRI</th></tr></thead><tbody>${rows}<tr class="deck-total"><td colspan=2>TOTAL</td><td class="num" style="font-family:ui-monospace,Menlo,monospace">${esc(p.total_nri)}</td></tr></tbody></table>`)}
      <div class="actions"><button class="btn primary" data-act="approve" ${p.balances ? '' : 'disabled'}>Approve deck</button>${p.approved_at ? `<span class="muted" style="align-self:center">Approved ${fmt(p.approved_at)}</span>` : ''}</div>
      ${group(`Curative & defects (${p.curative.length})`, `<table class="grid"><tbody>${cur}</tbody></table>`)}`;
    body.querySelectorAll('[data-cur]').forEach((b) => b.onclick = () => act(() => post(`/projects/${sel.id}/curative/${b.dataset.cur}`, { status: 'resolved' }), 'Curative resolved'));
    body.querySelector('[data-act=approve]').onclick = () => act(() => post(`/projects/${sel.id}/approve`), 'Deck approved ✓');
  } else if (sel.section === 'discovery') {
    const d = cache.discoveries.find((x) => x.id === sel.id) || {};
    body.innerHTML = `<p class="eyebrow">Discovered report</p><h1 class="title">${esc(d.root_domain || '')}</h1>
      ${group('Candidate', srow('URL', `<a class="ext" href="${esc(d.discovered_url)}" target="_blank" rel="noopener">${esc(d.discovered_url)}</a>`) + srow('Summary', esc(d.summary || '—'))
        + srow('Matched terms', esc((d.matched_terms || []).join(', '))) + srow('Risk tier', pill(d.risk_tier || '—')) + srow('Jurisdiction', esc(d.jurisdiction_level || '—')) + srow('Status', pill(d.status)))}
      ${d.status === 'new' ? `<div class="actions"><button class="btn primary" data-act="promote">Promote to obligation</button><button class="btn danger" data-act="reject">Reject</button></div>` : ''}`;
    const pr = body.querySelector('[data-act=promote]'); if (pr) pr.onclick = () => act(() => post(`/discoveries/${sel.id}/promote`), 'Promoted to obligation');
    const rj = body.querySelector('[data-act=reject]'); if (rj) rj.onclick = () => act(() => post(`/discoveries/${sel.id}/reject`), 'Rejected');
  } else if (sel.section === 'monitors') {
    const m = cache.monitors.find((x) => x.id === sel.id) || {};
    body.innerHTML = `<p class="eyebrow">Firecrawl monitor</p><h1 class="title">${esc(m.id)}</h1>
      ${group('Monitor', srow('URL', `<a class="ext" href="${esc(m.url)}" target="_blank" rel="noopener">${esc(m.url)}</a>`) + srow('Schedule', esc(m.schedule)) + srow('Last check', fmt(m.last_check_at)) + srow('Last result', pill(m.last_status)) + srow('Status', pill(m.status)) + srow('Obligation', esc(m.obligation_id || '—')))}
      <div class="actions"><button class="btn" data-act="toggle">${m.status === 'active' ? 'Pause monitor' : 'Resume monitor'}</button></div>`;
    body.querySelector('[data-act=toggle]').onclick = () => act(() => post(`/monitors/${sel.id}/toggle`), 'Monitor updated');
  }
}

// ---------- inspector ----------
function ifield(l, v) { return `<div class="ifield"><div class="il">${esc(l)}</div><div class="iv">${v}</div></div>`; }
function renderInspector() {
  const b = $('#inspBody');
  if (sel.section === 'compliance' && sel.id) {
    const o = cache.obligations.find((x) => x.id === sel.id) || {};
    b.innerHTML = `<div class="insp-sec">Identity</div>${ifield('Agency', esc(o.governing_agency))}${ifield('Citation', `<span class="mono">${esc(o.cfr_citation || '—')}</span>`)}${ifield('Jurisdiction', esc(o.jurisdiction_level || '—'))}
      <div class="insp-sec">Risk</div>${ifield('Tier', pill(o.risk_tier))}${ifield('Policy action', pill(o.policy_action))}${ifield('Status', pill(o.compliance_status, o.compliance_status))}
      <div class="insp-sec">Source</div>${ifield('Monitor', o.firecrawl_monitor_id ? `<span class="mono">${esc(o.firecrawl_monitor_id)}</span>` : '<span class="muted">none</span>')}`;
  } else if (sel.section === 'decks' && sel.id) {
    const p = cache.projects.find((x) => x.id === sel.id) || {};
    b.innerHTML = `<div class="insp-sec">Identity</div>${ifield('Project', esc(p.name))}${ifield('Unit', esc(p.unit_id || '—'))}
      <div class="insp-sec">Deck</div>${ifield('Owners', p.rows)}${ifield('Total NRI', `<span class="mono">${esc(p.total_nri)}</span>`)}${ifield('Balanced', pill(p.balances ? 'good' : 'Error', p.balances ? 'yes' : 'no'))}${ifield('Open curative', p.openCurative)}${ifield('Approval', p.approved_at ? pill('promoted', 'approved') : '<span class="muted">draft</span>')}`;
  } else if (sel.section === 'monitors' && sel.id) {
    const m = cache.monitors.find((x) => x.id === sel.id) || {};
    b.innerHTML = `<div class="insp-sec">Identity</div>${ifield('Monitor', `<span class="mono">${esc(m.id)}</span>`)}${ifield('Schedule', esc(m.schedule))}<div class="insp-sec">State</div>${ifield('Status', pill(m.status))}${ifield('Last result', pill(m.last_status))}${ifield('Last check', fmt(m.last_check_at))}`;
  } else if (sel.section === 'discovery' && sel.id) {
    const d = cache.discoveries.find((x) => x.id === sel.id) || {};
    b.innerHTML = `<div class="insp-sec">Identity</div>${ifield('Domain', esc(d.root_domain))}${ifield('Risk', pill(d.risk_tier || '—'))}${ifield('Jurisdiction', esc(d.jurisdiction_level || '—'))}${ifield('Status', pill(d.status))}`;
  } else {
    const d = cache.dash;
    b.innerHTML = `<div class="insp-sec">Operation</div>${ifield('Operator', 'op1')}${ifield('Obligations', d.obligations.total)}${ifield('Pending review', d.obligations.pendingReview)}${ifield('Monitors active', `${d.monitors.active} / ${d.monitors.total}`)}${ifield('Decks balanced', `${d.projects.balanced} / ${d.projects.total}`)}
      <div class="insp-empty">Select an item in the navigator to inspect it.</div>`;
  }
}

// ---------- glue ----------
function syncTabs() { document.querySelectorAll('#tabbar button').forEach((b) => b.classList.toggle('active', b.dataset.section === sel.section)); }
async function render() { renderStatus(); renderJumpbar(); renderNavigator(); renderInspector(); await renderEditor(); }
async function act(fn, msg) { try { await fn(); await loadAll(); toast(msg); await render(); } catch (e) { toast(e.message, true); } }
async function reload() { await loadAll(); await render(); }

document.querySelectorAll('#tabbar button').forEach((b) => b.onclick = () => { sel.section = b.dataset.section; sel.id = null; syncTabs(); render(); });
$('#navFilter').oninput = (e) => { navFilterText = (e.target.value || '').toLowerCase(); renderNavigator(); };
$('#togNav').onclick = () => document.body.classList.toggle('hide-nav');
$('#togInsp').onclick = () => document.body.classList.toggle('hide-insp');
$('#btnRefresh').onclick = () => reload();
$('#btnReset').onclick = async () => { await post('/admin/reset'); sel.id = null; await reload(); toast('Demo data reset'); };

loadAll().then(render).catch((e) => { $('#editorBody').innerHTML = `<div class="group" style="color:var(--crit)">Failed to load: ${esc(e.message)}</div>`; });

</script>
</body>
</html>
