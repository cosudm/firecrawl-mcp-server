# iOSLENS pilot stack — PostgreSQL/pgvector + the control-plane MCP server.
#
#   docker compose -f deploy/docker-compose.yml up --build
#
# The `migrate` one-shot applies the schema and seeds the v1 Matrix release, then
# the `ioslens` service serves the MCP API over HTTP with health checks.
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ioslens
      POSTGRES_PASSWORD: ioslens
      POSTGRES_DB: ioslens
    ports:
      - "5432:5432"
    volumes:
      - ioslens-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ioslens -d ioslens"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://ioslens:ioslens@db:5432/ioslens
    command: ["node", "bin/migrate.mjs", "--seed"]
    restart: "no"

  ioslens:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgres://ioslens:ioslens@db:5432/ioslens
      MCP_TRANSPORT: http
      MCP_HTTP_PORT: "8080"
      # Pilot: dev auth. In production set MCP_AUTH=entra + ENTRA_* and remove dev roles.
      MCP_AUTH: dev
      MCP_DEV_ROLES: Compliance.Read,Compliance.Decide,Matrix.Propose,Matrix.Admin,Audit.Read
    ports:
      - "8080:8080"

volumes:
  ioslens-pgdata:
